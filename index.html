<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0e0e11">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Hajime">
<title>Hajime</title>
<style>
:root{--bg:#0e0e11;--card:#17171b;--card2:#1f1f25;--line:#2a2a32;--text:#f2f2f4;--muted:#a0a0aa;--dim:#6b6b75;
--blue:#3b82f6;--green:#22c55e;--red:#ef4444;--amber:#f59e0b;--yellow:#eab308;--gray:#8b8b95}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--text);font:15px/1.4 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Noto Sans Arabic",sans-serif}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;touch-action:manipulation}
button:disabled{opacity:.35;cursor:default}
.hdr{position:sticky;top:0;z-index:5;display:flex;align-items:center;gap:6px;padding:calc(10px + env(safe-area-inset-top)) 10px 10px;background:#18181b;border-bottom:1px solid #27272a}
.hgrp{display:flex;gap:6px;align-items:center;flex:none}
.hbtn{height:34px;min-width:34px;padding:0 9px;border-radius:8px;border:none;background:#27272a;color:#a1a1aa;font-size:17px;font-weight:800;line-height:1}
.hbtn.txt{font-size:11px;letter-spacing:.04em}
.hbtn.arrow{color:var(--blue);font-size:18px}
.hbtn:disabled{opacity:.3}
.htitle{flex:1;min-width:0;text-align:center;font-weight:800;letter-spacing:.06em;text-transform:uppercase;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.ocard{background:#18181b;border:1px solid #27272a;border-radius:14px;padding:14px;margin-bottom:12px;display:flex;flex-direction:column;gap:8px}
.ocard.center{text-align:center;align-items:center}
.otitle{font-size:17px;font-weight:800;text-transform:uppercase;letter-spacing:.5px}
.otitle.big{font-size:26px;color:var(--blue);letter-spacing:1px}
.otitle.sm{font-size:15px}
.center{text-align:center}
.osmall{font-size:11px;color:#71717a;font-weight:700;margin-top:2px;letter-spacing:.03em}
.olabel{font-size:11px;font-weight:800;color:#71717a;text-transform:uppercase;letter-spacing:.5px}
.oblue{color:var(--blue);font-weight:800}
.orow{display:flex;justify-content:space-between;align-items:center}
.ofocus{font-size:18px;font-weight:900}
.obar{background:#27272a;height:8px;border-radius:4px;overflow:hidden}
.obar div{background:var(--blue);height:100%}
.og2{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:12px}
.obox{background:#18181b;border:1px solid #27272a;border-radius:10px;padding:12px 6px;text-align:center}
.oval{font-size:16px;font-weight:800;color:var(--blue);margin-top:4px;text-transform:uppercase;word-break:break-word}
.card.osplit,.card.oex{padding:16px}
.oname{font-weight:800;font-size:16px;text-transform:uppercase}
.oex .oname{font-size:15px}
.obadge{font-weight:900;font-size:15px;white-space:nowrap}
.card.odone{background:rgba(34,197,94,.12);border-color:#22c55e;color:#4ade80}
.card.opart{background:rgba(113,113,122,.25);border-color:#71717a}
.card.oskip{background:rgba(239,68,68,.12);border-color:#b91c1c;color:#fca5a5}
.osum{background:#151518;border:1px solid #27272a;border-left:3px solid #52525b;border-radius:12px;padding:12px;display:flex;flex-direction:column;gap:6px;margin-bottom:12px}
.osumrow{display:flex;gap:6px;align-items:center;background:#222226;padding:8px 10px;border-radius:8px;font-size:13px;font-weight:800;border:1px solid #2e2e33;font-variant-numeric:tabular-nums}
.osumrow small{font-size:10px;color:#71717a;font-weight:700}
.onote{font-size:12px;color:#93c5fd;padding-top:2px}
.oempty{font-size:11px;color:#52525b;text-align:center;font-weight:700;padding:4px 0}
.exbtn .xtra,.xtra{display:block;font-size:12px;color:#a1a1aa;font-weight:600;margin-top:2px}
.libbar{display:flex;gap:8px;margin:0 0 10px}
.excard{background:#1c1c21;border:1px solid #2c2c33;border-top:3px solid var(--blue);border-radius:14px;padding:14px;margin-bottom:10px;text-align:center;display:flex;flex-direction:column;align-items:center;gap:8px}
.excard .otitle{font-size:18px;line-height:1.25}
.trow{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:10px}
.trow.three{grid-template-columns:1fr 1fr 1fr}
.tbox{background:rgba(59,130,246,.08);border:1px solid rgba(59,130,246,.25);border-radius:10px;padding:7px 4px;text-align:center}
.tlabel{font-size:9.5px;font-weight:800;color:#8b8b95;letter-spacing:.08em}
.tval{font-size:14px;font-weight:800;color:#93c5fd;margin-top:2px;font-variant-numeric:tabular-nums}
.mrow{display:flex;gap:8px;margin-bottom:8px}
.mbox{flex:1;background:rgba(168,85,247,.08);border:1px solid rgba(168,85,247,.3);border-radius:10px;padding:8px 6px;text-align:center;min-width:0}
.mval{font-size:15px;font-weight:800;color:#d8b4fe;margin-top:2px;word-break:break-word}
.otitle.step{font-size:13px;letter-spacing:.1em;color:#d4d4d8;text-align:center}
.stepsub{font-size:12px;color:#8b8b95;text-align:center;font-weight:700;margin-top:-4px;font-variant-numeric:tabular-nums}
.qgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.qbtn{height:72px;border-radius:14px;border:3px solid transparent;font-size:28px;font-weight:900}
.qs{background:#eab308;color:#1a1400}.qa{background:#22c55e;color:#04210f}.qb{background:#3b82f6;color:#fff}.qc{background:#ef4444;color:#fff}
.qbtn.on{border-color:#fff;box-shadow:0 0 0 2px rgba(255,255,255,.25)}
.rgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.rgrid button{height:60px;border-radius:12px;border:1px solid #3f3f46;background:#27272a;font-size:24px;font-weight:800;font-variant-numeric:tabular-nums}
.rgrid button.on{background:var(--blue);border-color:var(--blue)}
.qchip{font-size:10px;font-weight:900;border-radius:6px;padding:2px 6px;background:#3f3f46;color:#e4e4e7;white-space:nowrap}
.qchip.qs,.qchip.qa,.qchip.qb,.qchip.qc{border:none}
.pp2{display:grid;grid-template-columns:2fr 1fr;gap:8px}
.in.ririn{width:64px;padding:8px}
.in.ririn.wide{width:120px}
.wrap{max-width:560px;margin:0 auto;padding:12px 14px calc(40px + env(safe-area-inset-bottom))}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px;margin:0 0 10px;display:flex;align-items:center;gap:10px}
.card[data-a]{cursor:pointer}
.grow{flex:1;min-width:0}
.ttl{font-weight:700}
.sub{color:var(--muted);font-size:13px;margin-top:2px}
.muted{color:var(--muted)}
.dim{color:var(--dim)}
.num{min-width:26px;height:26px;border-radius:8px;background:var(--card2);display:flex;align-items:center;justify-content:center;font-weight:700;font-size:13px}
.st-done{border-left:4px solid var(--green)}
.st-partial{border-left:4px solid var(--gray)}
.st-skip{border-left:4px solid var(--red)}
.st-none{border-left:4px solid transparent}
.dot{width:10px;height:10px;border-radius:50%;border:none;flex:none}
.dot.st-done{background:var(--green)}.dot.st-partial{background:var(--gray)}.dot.st-skip{background:var(--red)}.dot.st-none{background:var(--line)}
.pill{border:1px solid var(--line);background:var(--card2);border-radius:999px;padding:6px 11px;font-size:12px;font-weight:700;letter-spacing:.04em;white-space:nowrap}
.pill.red{color:#fca5a5;border-color:#5b2323}
.pill.blue{background:var(--blue);border-color:var(--blue)}
.sq{width:34px;height:34px;flex:none;border-radius:9px;border:1px solid var(--line);background:var(--card2);font-size:14px;display:inline-flex;align-items:center;justify-content:center}
.sq.red{color:#fca5a5}
.btn{display:block;width:100%;border:none;border-radius:12px;padding:14px;font-weight:800;letter-spacing:.06em;background:var(--blue);color:#fff;margin:8px 0}
.btn.ghost{background:transparent;border:1px solid var(--line);color:var(--text)}
.btn.danger{background:transparent;border:1px solid #5b2323;color:#fca5a5}
.btn.green{background:var(--green);color:#06210f}
.btn.sm{padding:10px;font-size:13px;margin:6px 0 0}
.row{display:flex;gap:8px;align-items:center}
.row>.btn{margin:8px 0}
.weekbar{display:flex;gap:8px;align-items:center;margin-bottom:6px}
.nav{width:44px;height:44px;border-radius:12px;border:1px solid var(--line);background:var(--card);font-size:22px}
.wsel,.in,.ta,select.in{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:11px 12px;width:100%;outline:none}
.wsel{flex:1;height:44px;font-weight:800;letter-spacing:.06em;text-align:center;text-align-last:center}
.in:focus,.ta:focus{border-color:var(--blue)}
.ta{min-height:110px;resize:vertical}
.meso-tag{color:var(--muted);font-size:12px;text-align:center;margin:0 0 12px;letter-spacing:.05em}
.rowbar{display:flex;justify-content:space-between;align-items:center;margin:2px 0 10px}
.lbl{font-size:11px;color:var(--muted);letter-spacing:.1em;font-weight:700;text-transform:uppercase;margin:14px 0 6px}
.empty{text-align:center;padding:50px 20px;color:var(--muted)}
.empty .big{font-size:40px}
.box{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px;margin-bottom:10px}
.cnote{background:#0f2342;border:1px solid #1e3a66;border-radius:12px;padding:10px 12px;margin-bottom:10px;white-space:pre-wrap}
.cnote b{display:block;font-size:11px;letter-spacing:.1em;color:#93c5fd;margin-bottom:3px}
.skipbox{background:#2a1313;border:1px solid #5b2323;border-radius:12px;padding:10px 12px;margin-bottom:10px}
.exhead{display:flex;align-items:center;gap:10px;margin-bottom:10px}
.exhead .ttl{font-size:19px;font-weight:800;flex:1}
.info2{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:10px}
.info2 div{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:8px 10px}
.info2 small{display:block;font-size:10px;color:var(--muted);letter-spacing:.12em;font-weight:700}
.info2 b{font-size:18px}
.chips{display:flex;gap:6px;overflow-x:auto;margin-bottom:10px;padding-bottom:2px}
.chip{flex:none;border:1px solid var(--line);background:var(--card);border-radius:10px;padding:7px 10px;font-size:13px;font-weight:700;min-width:58px;text-align:center}
.chip small{display:block;font-size:10px;color:var(--muted);font-weight:700}
.chip.on{border-color:var(--blue);box-shadow:0 0 0 1px var(--blue) inset}
.chip.c-done{background:#0f2a18}.chip.c-skip{background:#2a1313}.chip.c-partial{background:#26262c}
.acts{display:flex;gap:8px;margin-bottom:10px}
.acts .pill{flex:1;padding:9px 6px}
.kgd{background:#27272a;border:2px solid transparent;border-radius:12px;height:72px;display:flex;align-items:center;justify-content:center;gap:8px;padding:0 10px;margin-bottom:8px;font-variant-numeric:tabular-nums}
.kgd .num{font-size:40px;font-weight:900;line-height:1}
.kgd .unit{font-size:14px;font-weight:800;opacity:.55;line-height:1;margin-top:14px}
.kgd.ph{color:#71717a}
.kgd.typed{color:#eab308}
.kgd.on{border-color:var(--blue)}
.kg2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.kg2 .kgd{font-size:32px;flex-direction:column;cursor:pointer}
.kg2 .kgd small{font-size:10px;color:var(--muted);letter-spacing:.12em}
.pad{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.pad button{height:58px;border-radius:12px;border:none;background:#27272a;font-size:24px;font-weight:800;line-height:1;display:flex;align-items:center;justify-content:center;font-variant-numeric:tabular-nums}
.pad button.act{background:#3f3f46;color:var(--blue)}
.reps{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.reps button{height:56px;border-radius:12px;border:1px solid #3f3f46;background:#27272a;font-size:22px;font-weight:800;line-height:1;display:flex;align-items:center;justify-content:center;font-variant-numeric:tabular-nums}
.reps button.tg{border-color:#1e3a66;background:#0f2342}
.reps button.on{background:var(--blue);border-color:var(--blue)}
.err{color:#fca5a5;font-size:13px;min-height:18px;margin:6px 2px}
.prev{margin-top:14px}
.prev .line{display:flex;justify-content:space-between;padding:5px 0;border-bottom:1px solid var(--line);font-size:14px}
.prev .line:last-child{border-bottom:none}
.sync{position:relative;border:none;background:#27272a;border-radius:8px;height:34px;min-width:34px;padding:0 9px;font-size:11px;font-weight:800;display:flex;align-items:center;justify-content:center;gap:5px;white-space:nowrap}
.sync i{width:8px;height:8px;border-radius:50%;display:inline-block}
.s-ok i{background:var(--green)}.s-pend i{background:var(--amber)}.s-off i{background:var(--red)}.s-halt i{background:var(--red)}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:20;display:flex;align-items:flex-end;justify-content:center}
.modal[hidden]{display:none}
.sheet{background:#141418;border:1px solid var(--line);border-radius:18px 18px 0 0;width:100%;max-width:560px;max-height:88vh;overflow:auto;padding:16px 16px calc(18px + env(safe-area-inset-bottom))}
.sheet h3{margin:2px 0 10px;font-size:15px;letter-spacing:.08em;text-transform:uppercase}
.toast{position:fixed;left:50%;bottom:calc(22px + env(safe-area-inset-bottom));transform:translateX(-50%) translateY(20px);background:#26262d;border:1px solid var(--line);padding:10px 16px;border-radius:12px;opacity:0;pointer-events:none;transition:.25s;z-index:30;max-width:90vw;text-align:center}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.spin{width:30px;height:30px;border:3px solid var(--line);border-top-color:var(--blue);border-radius:50%;animation:sp 1s linear infinite;margin:60px auto}
@keyframes sp{to{transform:rotate(360deg)}}
.chipline{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}
.tag{font-size:11px;font-weight:800;letter-spacing:.05em;border-radius:6px;padding:3px 7px;background:var(--card2);color:var(--muted)}
.tag.green{background:#0f2a18;color:#86efac}.tag.red{background:#2a1313;color:#fca5a5}.tag.amber{background:#2d220c;color:#fcd34d}.tag.blue{background:#0f2342;color:#93c5fd}
.edday{display:block}
.edday-h{display:flex;gap:6px;align-items:center;margin-bottom:8px}
.edday-h .in{font-weight:800}
.slot{border-top:1px solid var(--line);padding:10px 0}
.slot-h{display:flex;gap:6px;align-items:center}
.exbtn{flex:1;min-width:0;text-align:left;background:var(--card2);border:1px solid var(--line);border-radius:10px;padding:8px 10px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.slot-b{display:flex;gap:6px;align-items:center;flex-wrap:wrap;margin:8px 0}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:10px;overflow:hidden}
.seg button{border:none;background:var(--card2);padding:8px 10px;font-weight:700;font-size:13px;border-right:1px solid var(--line)}
.seg button:last-child{border-right:none}
.seg button.on{background:var(--blue)}
.in.reps{width:74px;padding:8px}
.in.reps.on{border-color:var(--blue)}
.in.note{padding:8px 10px;font-size:14px}
.x{color:var(--muted)}
.info{font-size:12px;color:#93c5fd;margin:-2px 0 6px}
.warn{font-size:12px;color:#fcd34d;margin:-2px 0 6px}
.list-item{display:flex;align-items:center;gap:8px;padding:11px 4px;border-bottom:1px solid var(--line);cursor:pointer}
.list-item .grow{min-width:0}
.grp{font-size:11px;color:var(--muted);letter-spacing:.1em;font-weight:800;margin:14px 0 4px}
.check{display:flex;gap:10px;align-items:center;margin:10px 0}
.check input{width:20px;height:20px}
.savebar{font-size:12px;color:var(--muted);text-align:center;margin:4px 0 10px}
.savebar.bad{color:#fca5a5}
.linkbox{font:12px/1.4 ui-monospace,Menlo,monospace;word-break:break-all;color:var(--muted);margin:6px 0}
.review .it{border-top:1px solid var(--line);padding:10px 0}
.review .it:first-of-type{border-top:none}
.trsel{margin-bottom:10px;font-weight:800}
.tg{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.tg label,.tgs{display:block;font-size:11px;color:var(--muted);font-weight:700;letter-spacing:.06em}
.tg .in,.tgs .in{margin-top:4px;padding:9px 10px}
.kcal{margin:10px 2px;color:var(--muted)}
.kcal b{color:var(--text);font-size:18px}
.payline{display:flex;gap:8px;align-items:center;justify-content:space-between;border-top:1px solid var(--line);padding:8px 0 0;font-size:13px;margin-top:8px}
.sub.bad,.bad{color:#fca5a5}.sub.warnc{color:#fcd34d}.sub.okc{color:#86efac}
.testbox{border-color:#5b4a1a;background:#221c0b}
.edday-h .in{flex:1;min-width:0;padding:9px 10px}
.edday-a{display:flex;gap:6px;justify-content:flex-end;margin:-2px 0 6px}
.exbtn.full{white-space:normal;overflow:visible;text-overflow:clip;line-height:1.3}
.slot-f{display:flex;gap:6px;align-items:center}
.slot-f .in.note{flex:1;min-width:0}
.slot-f .sq{width:30px;height:30px;font-size:12px}
.seg.wide{display:flex;width:100%}.seg.wide button{flex:1;padding:10px 0}
.opt{display:block;width:100%;text-align:left;padding:12px;border-radius:12px;border:1px solid var(--line);background:var(--card);margin-bottom:6px;font-weight:700}
.opt.on{border-color:var(--blue);box-shadow:0 0 0 1px var(--blue) inset}
.jump{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0 12px}
.jump button{font-size:11px;padding:6px 8px;border-radius:8px;border:1px solid var(--line);background:var(--card2);font-weight:700}
.sec{border:1px solid var(--line);border-radius:12px;margin-bottom:8px;overflow:hidden;scroll-margin-top:72px}
.sec-h{width:100%;display:flex;justify-content:space-between;align-items:center;padding:12px;background:var(--card);border:none;font-weight:800;letter-spacing:.04em;text-align:left}
.sec-b{padding:0 12px 10px;background:var(--card)}
.cnt{color:var(--muted);font-size:12px}
.sumgrid{display:grid;grid-template-columns:1fr 1fr;gap:0 14px}
.sumrow{display:flex;justify-content:space-between;padding:6px 0;border-bottom:1px solid var(--line);font-size:14px}
.sumday{border-top:1px solid var(--line);padding:8px 0}
.sumline{display:flex;justify-content:space-between;gap:10px;font-size:13px;padding:2px 0}
.mebar{display:flex;gap:8px;justify-content:flex-end;margin-bottom:10px}
.startbtn{font-size:17px;padding:18px;margin:0 0 14px}
.qrow{display:flex;align-items:center;gap:8px;margin:8px 0}
.qrow span{width:46px;font-size:11px;font-weight:800;color:var(--muted);letter-spacing:.06em}
.qopts{display:flex;gap:6px;flex:1}
.qopts button{flex:1;height:40px;border-radius:10px;border:1px solid var(--line);background:var(--card);font-weight:800}
.qopts button.on{background:var(--blue);border-color:var(--blue)}
.tag.mine{background:#1d2a14;color:#bef264}
</style>
</head>
<body>
<header class="hdr">
  <div class="hgrp">
    <button class="hbtn txt" id="hBack" data-a="nav.back" hidden aria-label="Back">BACK</button>
    <button class="hbtn arrow" id="hStepP" data-a="t.stepPrev" hidden aria-label="Previous step">‹</button>
    <button class="hbtn arrow" id="hStepN" data-a="t.stepNext" hidden aria-label="Next step">›</button>
  </div>
  <div class="htitle" id="hTitle">HAJIME</div>
  <div class="hgrp">
    <button class="hbtn" id="hUndo" data-a="nav.undo" hidden aria-label="Undo">↶</button>
    <button class="hbtn" id="hRedo" data-a="nav.redo" hidden aria-label="Redo">↷</button>
    <button class="hbtn txt" id="hHome" data-a="nav.home" hidden aria-label="Home">HOME</button>
    <div id="hRight"></div>
  </div>
</header>
<main class="wrap" id="main"><div class="spin"></div></main>
<div class="modal" id="modal" hidden><div class="sheet" id="sheet"></div></div>
<div class="toast" id="toast"></div>

<script>
'use strict';
/* ======================================================================
   CONFIG — paste your Apps Script web app URL (ends with /exec)

function addMonthsYmd(s, n) {

function ago(iso) {
  if (!iso) return 'never';

async function api(params, body) {

  }

  const ctrl = new AbortController();
  const timer = setTimeout(() => ctrl.abort(), 30000);
  try {
    const url = CONFIG.API_URL + (params ? '?' + new URLSearchParams(params).toString() : '');
    const res = await fetch(url, body ? { method: 'POST', body: JSON.stringify(body), signal: ctrl.signal } : { signal: ctrl.signal });
    const text = await res.text();

/* ======================================================================
   SHARED DATA MODEL (same rules as the sheet)
   ====================================================================== */
const ek = (m, w, s) => m + '|' + w + '|' + s;
const sk = (m, w, s, n) => m + '|' + w + '|' + s + '|' + n;
const isSkip = (st) => st === 'skip' || st === 'skipex' || st === 'skipday';

function normMeso(m) { return { id: String(m.id), num: +m.num || 0, title: m.title || '', weeks: +m.weeks || 0, days: Array.isArray(m.days) ? m.days : [], status: m.status || '', startWeek: +m.startWeek || 0 }; }
function normPlan(p) { return { meso: p.meso, slot: p.slot, day: p.day, pos: +p.pos || 0, fromWeek: +p.fromWeek || 1, ex: p.ex || '', sets: +p.sets || 0, reps: String(p.reps || ''), note: p.note || '', rir: String(p.rir || '') }; }
function normEntry(e) { return { meso: e.meso, week: +e.week, day: e.day || '', slot: e.slot, ex: e.ex || '', order: +e.order || 0, status: e.status || '', reason: e.reason || '', tnote: e.tnote || '', cnote: e.cnote || '' }; }
function normSet(s) { return { meso: s.meso, week: +s.week, slot: s.slot, n: +s.n, ex: s.ex || '', kg: String(s.kg || ''), reps: String(s.reps || ''), status: s.status || '', reason: s.reason || '',
  rir: String(s.rir || ''), rq: String(s.rq || ''), tq: String(s.tq || '') }; }

function indexData(raw) {
  const D = { trainee: raw.trainee || {}, exMap: {}, planByMeso: {}, entries: {}, sets: {},
              payments: Array.isArray(raw.payments) ? raw.payments : [], targets: Array.isArray(raw.targets) ? raw.targets : [] };
  (raw.exercises || []).forEach((x) => { D.exMap[x.id] = x; });
  D.mesosAll = (raw.mesos || []).map(normMeso);
  D.mesoById = {};
  D.mesosAll.forEach((m) => { D.mesoById[m.id] = m; });
  D.mesos = D.mesosAll.filter((m) => m.status === 'published').sort((a, b) => a.startWeek - b.startWeek);
  D.drafts = D.mesosAll.filter((m) => m.status === 'draft').sort((a, b) => a.num - b.num);
  (raw.plan || []).forEach((p) => { const r = normPlan(p); (D.planByMeso[r.meso] = D.planByMeso[r.meso] || []).push(r); });
  (raw.entries || []).forEach((e) => { const r = normEntry(e); D.entries[ek(r.meso, r.week, r.slot)] = r; });
  (raw.sets || []).forEach((s) => { const r = normSet(s); D.sets[sk(r.meso, r.week, r.slot, r.n)] = r; });
  D.weeks = [];
  D.mesos.forEach((m) => { for (let w = 1; w <= m.weeks; w++) D.weeks.push({ meso: m.id, w, g: m.startWeek + w - 1 }); });
  return D;
}

function exInfo(D, id) { return D.exMap[id] || { id, name: id || '—', video: '', prime: false, muscle: '' }; }
function entryOf(D, m, w, slot) { return D.entries[ek(m, w, slot)] || null; }
function setOf(D, m, w, slot, n) { return D.sets[sk(m, w, slot, n)] || null; }
function entryHasData(e) { return !!(e && (e.status || e.tnote || e.order)); }
function setHasData(s) { return !!(s && (s.kg || s.reps || s.status)); }

function slotHasLogs(D, m, w, slot) {
  if (entryHasData(entryOf(D, m, w, slot))) return true;
  for (let n = 1; n <= MAX_SETS; n++) if (setHasData(setOf(D, m, w, slot, n))) return true;
  return false;
}
function loggedEx(D, m, w, slot) {
  for (let n = 1; n <= MAX_SETS; n++) { const s = setOf(D, m, w, slot, n); if (s && s.ex) return s.ex; }
  const e = entryOf(D, m, w, slot);
  return e && e.ex ? e.ex : '';
}

/** Items of a day for a week, in the coach's planned order. */
function resolveDay(D, m, w, dayId) {
  const bySlot = {};
  (D.planByMeso[m.id] || []).forEach((p) => { if (p.day === dayId) (bySlot[p.slot] = bySlot[p.slot] || []).push(p); });
  const items = [];
  Object.keys(bySlot).forEach((slot) => {
    const vs = bySlot[slot].slice().sort((a, b) => a.fromWeek - b.fromWeek);
    let act = null;
    vs.forEach((v) => { if (v.fromWeek <= w) act = v; });
    const withEx = vs.filter((v) => v.ex);
    const lastEx = withEx[withEx.length - 1];
    if (act && act.ex) items.push({ slot, day: dayId, ex: act.ex, sets: act.sets, reps: act.reps, note: act.note, rir: act.rir, pos: act.pos, from: act.fromWeek });
    else if (lastEx && slotHasLogs(D, m.id, w, slot)) items.push({ slot, day: dayId, ex: loggedEx(D, m.id, w, slot) || lastEx.ex, sets: lastEx.sets, reps: lastEx.reps, note: '', rir: lastEx.rir, pos: (act || lastEx).pos, from: 0, stale: true });
  });
  items.sort((a, b) => (a.pos - b.pos) || (a.slot < b.slot ? -1 : a.slot > b.slot ? 1 : 0));
  items.forEach((it, i) => { it.planned = i + 1; });
  return items;
}

/** Same items in the order the trainee chose (if they reordered). */
function orderedItems(D, m, w, dayId) {
  const items = resolveDay(D, m, w, dayId);
  const ord = (it) => { const e = entryOf(D, m.id, w, it.slot); return e && e.order ? e.order : 100 + it.planned; };
  if (!items.some((it) => { const e = entryOf(D, m.id, w, it.slot); return e && e.order; })) return items;
  return items.slice().sort((a, b) => ord(a) - ord(b));
}

function setState(s) {
  if (!s) return 'empty';
  if (isSkip(s.status)) return 'skip';
  if (s.kg && s.reps) return 'done';
  if (s.kg || s.reps) return 'partial';
  return 'empty';
}
function exStatus(D, mid, w, it) {
  const e = entryOf(D, mid, w, it.slot);
  if (e && (e.status === 'skip' || e.status === 'skipday')) return 'skip';
  let done = 0, touched = 0;
  for (let n = 1; n <= it.sets; n++) { const st = setState(setOf(D, mid, w, it.slot, n)); if (st === 'done') done++; if (st !== 'empty') touched++; }
  if (done === it.sets) return 'done';
  return touched ? 'partial' : 'none';
}
function exFinished(D, mid, w, it) {
  const st = exStatus(D, mid, w, it);
  if (st === 'done' || st === 'skip') return true;
  for (let n = 1; n <= it.sets; n++) { const s = setState(setOf(D, mid, w, it.slot, n)); if (s !== 'done' && s !== 'skip') return false; }
  return true;
}
function doneSets(D, mid, w, it) { let c = 0; for (let n = 1; n <= it.sets; n++) if (setState(setOf(D, mid, w, it.slot, n)) === 'done') c++; return c; }
function dayStatus(D, m, w, dayId) {
  const items = resolveDay(D, m, w, dayId);
  if (!items.length) return 'none';
  const sts = items.map((it) => exStatus(D, m.id, w, it));
  if (sts.every((s) => s === 'done')) return 'done';
  if (sts.every((s) => s === 'skip')) return 'skip';
  return sts.some((s) => s !== 'none') ? 'partial' : 'none';
}
function weekActive(D, wk) {
  const m = D.mesoById[wk.meso];
  return m.days.some((d) => resolveDay(D, m, wk.w, d.id).some((it) => slotHasLogs(D, m.id, wk.w, it.slot)));
}
function weekFinished(D, wk) {
  const m = D.mesoById[wk.meso];
  return m.days.every((d) => resolveDay(D, m, wk.w, d.id).every((it) => exFinished(D, m.id, wk.w, it)));
}
function currentWeekIndex(D) {
  if (!D.weeks.length) return 0;
  let last = -1;
  D.weeks.forEach((wk, i) => { if (weekActive(D, wk)) last = i; });
  if (last < 0) { const latest = D.mesos[D.mesos.length - 1]; return Math.max(0, D.weeks.findIndex((wk) => wk.meso === latest.id)); }
  if (weekFinished(D, D.weeks[last]) && last + 1 < D.weeks.length) return last + 1;
  return last;
}
function mesoLabel(m) { return 'Mesocycle ' + m.num + (m.title ? ' · ' + m.title : ''); }

/** Most recent earlier performance of the same exercise (same slot first). */
function prevPerf(D, wi, it) {
  const collect = (meso, w, slot) => {
    const sets = [];
    for (let n = 1; n <= MAX_SETS; n++) {
      const s = setOf(D, meso, w, slot, n);
      if (s && (!s.ex || s.ex === it.ex) && setState(s) !== 'empty') sets.push({ n, kg: s.kg, reps: s.reps, st: setState(s), reason: s.reason, rir: s.rir, rq: s.rq, tq: s.tq });
    }
    if (!sets.length) return null;
    const e = entryOf(D, meso, w, slot) || {};
    return { sets, tnote: e.tnote || '', cnote: e.cnote || '' };
  };
  const cur = D.weeks[wi];
  const cm = D.mesoById[cur.meso];
  const curDi = cm.days.findIndex((d) => d.id === it.day);
  const curName = curDi >= 0 ? cm.days[curDi].name : '';
  // other slots that logged this exercise in a week: prefer the same day name, then the latest day
  const bestSlot = (meso, w, keep) => {
    const m = D.mesoById[meso];
    const dayOf = {};
    (D.planByMeso[meso] || []).forEach((p) => { dayOf[p.slot] = p.day; });
    const prefix = meso + '|' + w + '|';
    const found = {};
    Object.keys(D.sets).forEach((k) => { const s = D.sets[k]; if (k.indexOf(prefix) === 0 && s.ex === it.ex && setState(s) !== 'empty') found[s.slot] = true; });
    const cands = Object.keys(found).map((slot) => {
      const di = m.days.findIndex((d) => d.id === dayOf[slot]);
      return { slot, di, name: di >= 0 ? m.days[di].name : '' };
    }).filter(keep || (() => true));
    cands.sort((a, b) => ((b.name === curName) - (a.name === curName)) || (b.di - a.di));
    return cands.length ? cands[0].slot : '';
  };
  for (let i = wi - 1; i >= 0; i--) {
    const wk = D.weeks[i];
    const same = collect(wk.meso, wk.w, it.slot);
    if (same) return Object.assign({ g: wk.g }, same);
    const s = bestSlot(wk.meso, wk.w);
    if (s) { const r = collect(wk.meso, wk.w, s); if (r) return Object.assign({ g: wk.g }, r); }
  }
  // nothing in earlier weeks → an earlier day of this same week
  const s = bestSlot(cur.meso, cur.w, (c) => c.di >= 0 && c.di < curDi && c.slot !== it.slot);
  if (s) { const r = collect(cur.meso, cur.w, s); if (r) return Object.assign({ g: cur.g }, r); }
  return null;
}

/** Latest coach note for this exercise up to this week (carries forward until changed). */
function coachNoteFor(D, m, w, it) {
  for (let x = w; x >= 1; x--) {
    const e = entryOf(D, m.id, x, it.slot);
    if (e && e.cnote && (!e.ex || e.ex === it.ex)) return e.cnote;
  }
  return it.note || '';
}

function firstEditableWeek(D, m, dayId) {
  const slotDay = {};
  (D.planByMeso[m.id] || []).forEach((p) => { slotDay[p.slot] = p.day; });
  let last = 0;
  Object.keys(D.entries).forEach((k) => { const e = D.entries[k]; if (e.meso === m.id && entryHasData(e) && (e.day || slotDay[e.slot]) === dayId) last = Math.max(last, e.week); });
  Object.keys(D.sets).forEach((k) => { const s = D.sets[k]; if (s.meso === m.id && setHasData(s) && slotDay[s.slot] === dayId) last = Math.max(last, s.week); });
  return last + 1;
}

function mesoHasLogs(D, mid) {
  return Object.keys(D.entries).some((k) => D.entries[k].meso === mid && entryHasData(D.entries[k])) ||
         Object.keys(D.sets).some((k) => D.sets[k].meso === mid && setHasData(D.sets[k]));
}

/* ======================================================================
   TRAINEE APP
   ====================================================================== */
const T = {
  key: '', D: null, queue: [], flushing: false, timer: null, backoff: 0, offline: false, halted: false,
  ui: { screen: 'week', wi: 0, day: '', slot: '', n: 1, step: 'kg', k1: '', k2: '', pin: 1, err: '', reorder: false, note: null }
};
const qKey = () => 'hj_q_' + T.key;
const sKey = () => 'hj_s_' + T.key;

async function bootTrainee(key) {
  APP.mode = 'trainee';
  Nav.onBack = appBack;
  await initTrainee(key, false);
}

async function initTrainee(key, self) {
  T.self = !!self;
  if (T.key !== key) {
    T.key = key;
    T.D = null;
    T.halted = false;
    T.queue = LS.get(qKey(), []);
    if (!Array.isArray(T.queue)) T.queue = [];
    T.ui = { screen: 'home', wi: 0, day: '', slot: '', n: 1, step: 'kg', k1: '', k2: '', pin: 1, err: '', reorder: false, note: null };
    U.stack = []; U.redo = [];
    const cached = LS.get(sKey(), null);
    if (cached && cached.ok) {
      applyServer(cached);
      T.ui.wi = currentWeekIndex(T.D);
      renderT();
    } else {
      main('<div class="spin"></div>');
    }
  }
  if (!T.listening) {
    T.listening = true;
    window.addEventListener('online', () => { T.offline = false; flushSoon(0); });
    document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible') { flushSoon(0); loadT(); } });
  }
  await loadT();
  flushSoon(0);
}

async function loadT() {
  const key = T.key;
  if (!key) return;
  const show = () => APP.mode !== 'coach' && key === T.key;
  try {
    const res = await api({ a: 'state', k: key });
    if (key !== T.key) return;
    if (!res.ok) {
      if (res.error === 'expired') { T.halted = true; return show() && renderMessage('Subscription ended', 'Your subscription has ended. Contact your coach to renew.'); }
      if (res.error === 'notfound') { T.halted = true; return show() && renderMessage('Link not valid', 'Please check the link your coach sent you.'); }
      throw new AppError('server', res.error || 'Server error');
    }
    LS.set(sKey(), res);
    const first = !T.D;
    applyServer(res);
    if (first) T.ui.wi = currentWeekIndex(T.D);
    clampUi();
    const typing = document.activeElement && /TEXTAREA|INPUT/.test(document.activeElement.tagName);
    if (!typing && show()) renderT(true);
  } catch (err) {
    if (!T.D && show()) renderMessage('Couldn’t load your program', err.code === 'network' ? 'Check your internet connection and try again.' : err.message, 'TRY AGAIN', 't.reload');
    else if (err.code === 'network') { T.offline = true; updateSync(); }
  }
}
ACT['t.reload'] = () => { main('<div class="spin"></div>'); loadT(); };

function applyServer(raw) {
  T.D = indexData(raw);
  T.queue.forEach((op) => applyOp(T.D, op));
}

function clampUi() {
  const D = T.D;
  if (T.ui.wi >= D.weeks.length) T.ui.wi = Math.max(0, D.weeks.length - 1);
  if (!D.weeks.length) { T.ui.screen = 'home'; return; }
  const m = D.mesoById[D.weeks[T.ui.wi].meso];
  if ((T.ui.screen === 'day' || T.ui.screen === 'ex') && !m.days.some((d) => d.id === T.ui.day)) T.ui.screen = 'week';
}

/* ---------- sync queue ---------- */
function applyOp(D, op) {
  if (op.t === 'set') {
    const k = sk(op.meso, op.week, op.slot, op.n);
    const prev = D.sets[k] || {};
    D.sets[k] = { meso: op.meso, week: op.week, slot: op.slot, n: op.n, ex: op.ex || prev.ex || '', kg: op.kg, reps: op.reps, status: op.status, reason: op.reason || '',
                  rir: 'rir' in op ? op.rir : (prev.rir || ''), rq: 'rq' in op ? op.rq : (prev.rq || ''), tq: 'tq' in op ? op.tq : (prev.tq || '') };
  } else if (op.t === 'entry') {
    const k = ek(op.meso, op.week, op.slot);
    const e = D.entries[k] || { meso: op.meso, week: op.week, slot: op.slot, day: op.day || '', ex: op.ex || '', order: 0, status: '', reason: '', tnote: '', cnote: '' };
    ['status', 'reason', 'tnote'].forEach((f) => { if (f in op) e[f] = op[f]; });
    if ('order' in op) e.order = +op.order || 0;
    if (op.ex) e.ex = op.ex;
    D.entries[k] = e;
  } else if (op.t === 'order') {
    op.slots.forEach((s, i) => {
      const k = ek(op.meso, op.week, s);
      const e = D.entries[k] || { meso: op.meso, week: op.week, slot: s, day: op.day || '', ex: (op.ex || {})[s] || '', order: 0, status: '', reason: '', tnote: '', cnote: '' };
      e.order = i + 1;
      D.entries[k] = e;
    });
  }
}

function enqueue(op) {
  const keys = U.tx ? snapKeys(op) : [];
  keys.forEach((k) => { if (!(k in U.tx.before)) U.tx.before[k] = snapOf(k); });
  enqueueRaw(op);
  keys.forEach((k) => { U.tx.after[k] = snapOf(k); });
}
function enqueueRaw(op) {
  op.oid = uid();
  const inflight = T.inflight || {};
  if (op.t === 'set') {
    // a newer full set record replaces an unsent older one
    T.queue = T.queue.filter((q) => inflight[q.oid] || !(q.t === 'set' && q.meso === op.meso && q.week === op.week && q.slot === op.slot && q.n === op.n));
  }
  T.queue.push(op);
  if (!LS.set(qKey(), T.queue)) toast('Phone storage is full — keep the app open until it syncs');
  applyOp(T.D, op);
  updateSync();
  flushSoon(250);
}

function flushSoon(ms) { clearTimeout(T.timer); T.timer = setTimeout(flush, ms); }

async function flush() {
  if (T.flushing || T.halted || !T.queue.length) { updateSync(); return; }
  T.flushing = true;
  const batch = T.queue.slice(0, 40);
  T.inflight = {};
  batch.forEach((o) => { T.inflight[o.oid] = true; });
  updateSync();
  let again = false;
  try {
    const res = await api(null, { k: T.key, ops: batch });
    if (!res.ok) {
      if (res.fatal) { T.halted = true; toast(res.error === 'expired' ? 'Subscription ended — changes not sent' : 'Link not valid'); return; }
      throw new AppError('server', res.error || 'Server error');
    }
    const done = {};
    (res.applied || []).forEach((o) => { done[o] = true; });
    (res.rejected || []).forEach((r) => { done[r.oid] = true; });
    T.queue = T.queue.filter((o) => !done[o.oid]);
    LS.set(qKey(), T.queue);
    if ((res.rejected || []).length) { console.warn('Rejected', res.rejected); toast('Some entries couldn’t be saved'); }
    T.offline = false;
    T.backoff = 0;
    again = T.queue.length > 0;
  } catch (err) {
    if (err.code === 'network') T.offline = true;
    T.backoff = Math.min(T.backoff ? T.backoff * 2 : 2000, 60000);
    flushSoon(T.backoff);
  } finally {
    T.flushing = false;
    T.inflight = null;
    updateSync();
  }
  if (again) flushSoon(0);
}

function syncPill() {
  const n = T.queue.length;
  let cls = 's-ok', txt = 'SYNCED';
  if (T.halted) { cls = 's-halt'; txt = 'STOPPED'; }
  else if (n && T.offline) { cls = 's-off'; txt = 'OFFLINE · ' + n; }
  else if (n) { cls = 's-pend'; txt = 'SAVING · ' + n; }
  return `<button class="sync ${cls}" data-a="t.sync" aria-label="Sync status"><i></i>${n ? n : ''}<span class="sr">${txt}</span></button>`;
}
function updateSync() { if (APP.mode !== 'coach' && T.key && T.D && !T.halted) $('#hRight').innerHTML = syncPill(); }
ACT['t.sync'] = () => { if (T.queue.length) { T.backoff = 0; flushSoon(0); toast('Sending…'); } else toast('Everything is saved'); };

/* ---------- context ---------- */
function curWeek() { return T.D.weeks[T.ui.wi]; }
function curMeso() { return T.D.mesoById[curWeek().meso]; }
function curItems() { const wk = curWeek(); return orderedItems(T.D, curMeso(), wk.w, T.ui.day); }
function curItem() { return curItems().find((x) => x.slot === T.ui.slot) || null; }
function exMain(x) { return x && x.mine && x.baseName ? x.baseName : (x ? x.name : ''); }
function exExtra(x) { return x && x.mine ? [x.machine || '', x.seat ? 'Seat ' + x.seat : ''].filter(Boolean).join(' · ') : ''; }

function renderT(keepScroll) {
  if (!T.D || T.halted) return;
  if (!T.D.weeks.length) T.ui.screen = 'home';
  if (T.ui.screen === 'ex') return renderEx(keepScroll);
  if (T.ui.screen === 'day') return renderDay(keepScroll);
  if (T.ui.screen === 'week') return renderWeek(keepScroll);
  return renderHomeT(keepScroll);
}
function tBack() {
  if (T.ui.screen === 'ex') { saveNote(); T.ui.screen = 'day'; }
  else if (T.ui.screen === 'day') { T.ui.screen = 'week'; T.ui.reorder = false; }
  else if (T.ui.screen === 'week') T.ui.screen = 'home';
  renderT();
}
function tHome() {
  if (T.ui.screen === 'ex') saveNote();
  T.ui.screen = 'home';
  T.ui.reorder = false;
  renderT();
}

/* ---------- undo / redo of what you enter (weights, reps, skips, notes, order) ---------- */
const U = { stack: [], redo: [], tx: null };
function snapKeys(op) {
  if (op.t === 'set') return ['s|' + op.meso + '|' + op.week + '|' + op.slot + '|' + op.n];
  if (op.t === 'entry') return ['e|' + op.meso + '|' + op.week + '|' + op.slot];
  if (op.t === 'order') return op.slots.map((x) => 'e|' + op.meso + '|' + op.week + '|' + x);
  return [];
}
function snapOf(key) {
  const p = key.split('|');
  const o = p[0] === 's' ? T.D.sets[sk(p[1], p[2], p[3], p[4])] : T.D.entries[ek(p[1], p[2], p[3])];
  return o ? JSON.parse(JSON.stringify(o)) : null;
}
function tx(fn) {
  U.tx = { before: {}, after: {}, focus: null };
  try { fn(); } finally {
    const t = U.tx;
    U.tx = null;
    if (t && Object.keys(t.before).length) { U.stack.push(t); if (U.stack.length > 60) U.stack.shift(); U.redo = []; }
    updateUndoBtns();
  }
}
function restoreSnaps(target, other) {
  Object.keys(target).forEach((key) => {
    const p = key.split('|');
    const v = target[key] || {};
    const ex = v.ex || (other[key] || {}).ex || '';
    if (p[0] === 's') {
      enqueue({ t: 'set', meso: p[1], week: +p[2], slot: p[3], n: +p[4], ex, kg: v.kg || '', reps: v.reps || '', status: v.status || '',
                reason: v.reason || '', rir: v.rir || '', rq: v.rq || '', tq: v.tq || '' });
    } else {
      enqueue({ t: 'entry', meso: p[1], week: +p[2], slot: p[3], day: v.day || (other[key] || {}).day || '', ex, status: v.status || '',
                reason: v.reason || '', tnote: v.tnote || '', order: v.order ? String(v.order) : '' });
    }
  });
}
function afterUndo(t) {
  T.ui.k1 = ''; T.ui.k2 = ''; T.ui.err = '';
  if (T.ui.screen === 'ex' && t.focus && t.focus.slot === T.ui.slot) {
    T.ui.n = t.focus.n;
    const s = setOf(T.D, curMeso().id, curWeek().w, T.ui.slot, t.focus.n);
    T.ui.step = t.focus.step && t.focus.step !== 'note' ? t.focus.step : (s && s.kg && !isSkip(s.status) ? 'reps' : 'kg');
  }
  if (T.ui.screen === 'ex') { const e = entryOf(T.D, curMeso().id, curWeek().w, T.ui.slot); T.ui.note = e ? e.tnote : ''; }
  updateUndoBtns();
  renderT(true);
}
function logUndo() { const t = U.stack.pop(); if (!t) return; restoreSnaps(t.before, t.after); U.redo.push(t); afterUndo(t); toast('Undone'); }
function logRedo() { const t = U.redo.pop(); if (!t) return; restoreSnaps(t.after, t.before); U.stack.push(t); afterUndo(t); toast('Redone'); }

/* ---------- home ---------- */
function weekWorkouts(D, wk) {
  const m = D.mesoById[wk.meso];
  const done = m.days.filter((d) => { const its = resolveDay(D, m, wk.w, d.id); return its.length && its.every((it) => exFinished(D, m.id, wk.w, it)); }).length;
  return { done, total: m.days.length };
}
function renderHomeT(keepScroll) {
  const D = T.D;
  hdr({ title: 'HAJIME', undo: true, right: syncPill() });
  const bar = T.self ? `<div class="row"><button class="btn ghost" data-a="me.program">MY PROGRAM</button><button class="btn ghost" data-a="me.coach">COACH</button></div>` : '';
  if (!D.weeks.length) {
    return main(`<div class="ocard center"><div class="otitle big">HAJIME</div></div>
      <div class="ocard center"><p>${T.self ? 'No program yet — build it from MY PROGRAM.' : 'Your program isn’t ready yet. Your coach will publish it soon.'}</p></div>${bar}`, keepScroll);
  }
  const wk = D.weeks[currentWeekIndex(D)], m = D.mesoById[wk.meso];
  const cur = weekWorkouts(D, wk);
  let all = 0, allDone = 0;
  D.weeks.forEach((w) => { const r = weekWorkouts(D, w); all += r.total; allDone += r.done; });
  const pct = (a, b) => (b ? Math.round((a / b) * 100) : 0);
  main(`<div class="ocard center"><div class="otitle big">HAJIME</div><div class="osmall">${esc(mesoLabel(m))}</div></div>
    <div class="ocard"><div class="orow"><span class="olabel">CURRENT FOCUS</span><span class="oblue">WEEK ${wk.g}</span></div>
      <div class="ofocus">${cur.done} OF ${cur.total} WORKOUTS DONE</div>
      <div class="obar"><div style="width:${pct(cur.done, cur.total)}%"></div></div></div>
    <button class="btn startbtn" data-a="t.start">START WORKOUT</button>
    ${bar}
    <div class="ocard"><div class="orow olabel"><span>TOTAL PROGRESS</span><span>${allDone} / ${all} (${pct(allDone, all)}%)</span></div></div>`, keepScroll);
}
ACT['t.start'] = () => {
  if (!T.D || !T.D.weeks.length) return;
  T.ui.wi = currentWeekIndex(T.D);
  T.ui.screen = 'week';
  Nav.push();
  renderWeek();
};

/* ---------- days of the week ---------- */
function renderWeek(keepScroll) {
  const D = T.D;
  hdr({ title: 'WORKOUTS', back: true, home: true, undo: true, right: syncPill() });
  const wk = curWeek(), m = curMeso();
  let opts = '';
  D.mesos.forEach((mm) => {
    opts += `<optgroup label="${esc(mesoLabel(mm))}">`;
    D.weeks.forEach((x, i) => { if (x.meso === mm.id) { const r = weekWorkouts(D, x); opts += `<option value="${i}"${i === T.ui.wi ? ' selected' : ''}>WEEK ${x.g} (${r.done}/${r.total})</option>`; } });
    opts += '</optgroup>';
  });
  main(`<div class="weekbar">
      <button class="nav" data-a="t.wprev" ${T.ui.wi <= 0 ? 'disabled' : ''} aria-label="Previous week">‹</button>
      <select class="wsel" data-ch="t.wsel">${opts}</select>
      <button class="nav" data-a="t.wnext" ${T.ui.wi >= D.weeks.length - 1 ? 'disabled' : ''} aria-label="Next week">›</button>
    </div>
    ${m.days.map((d) => dayCard(D, m, wk.w, d)).join('')}`, keepScroll);
}
function daySkipInfo(D, m, w, items) {
  let reason = '', has = false;
  items.forEach((it) => {
    const e = entryOf(D, m.id, w, it.slot);
    if (e && e.status === 'skipday') { has = true; reason = reason || e.reason; }
    for (let n = 1; n <= it.sets; n++) { const s = setOf(D, m.id, w, it.slot, n); if (s && s.status === 'skipday') { has = true; reason = reason || s.reason; } }
  });
  return { has, reason };
}
const stCls = (st) => (st === 'done' ? 'odone' : st === 'skip' ? 'oskip' : st === 'partial' ? 'opart' : '');
function dayCard(D, m, w, d) {
  const items = resolveDay(D, m, w, d.id);
  const st = dayStatus(D, m, w, d.id);
  const fin = items.filter((it) => exFinished(D, m.id, w, it)).length;
  const sk2 = daySkipInfo(D, m, w, items);
  let btn = '';
  if (sk2.has) btn = `<button class="pill" data-a="t.undoSkipDay" data-day="${esc(d.id)}">UNDO SKIP</button>`;
  else if (items.length && fin < items.length) btn = `<button class="pill red" data-a="t.skipDay" data-day="${esc(d.id)}">SKIP DAY</button>`;
  return `<div class="card osplit ${stCls(st)}" data-a="t.openDay" data-day="${esc(d.id)}">
    <div class="grow"><div class="oname">${esc(d.name)}</div>
      <div class="osmall">${items.length} EXERCISES${sk2.has && sk2.reason ? ' · SKIPPED: ' + esc(sk2.reason) : ''}</div></div>
    ${btn}<div class="obadge">${fin} / ${items.length}${st === 'done' ? ' ✓' : ''}</div></div>`;
}
CHG['t.wsel'] = (el) => { T.ui.wi = +el.value; renderWeek(); };
ACT['t.wprev'] = () => { if (T.ui.wi > 0) { T.ui.wi--; renderWeek(); } };
ACT['t.wnext'] = () => { if (T.ui.wi < T.D.weeks.length - 1) { T.ui.wi++; renderWeek(); } };
ACT['t.openDay'] = (ds) => { T.ui.day = ds.day; T.ui.screen = 'day'; T.ui.reorder = false; Nav.push(); renderDay(); };
ACT['t.skipDay'] = async (ds) => {
  const reason = await askReason('Skip this day');
  if (!reason) return;
  const wk = curWeek(), m = curMeso();
  tx(() => resolveDay(T.D, m, wk.w, ds.day).forEach((it) => {
    const st = exStatus(T.D, m.id, wk.w, it);
    if (st === 'none') {
      enqueue({ t: 'entry', meso: m.id, week: wk.w, slot: it.slot, day: ds.day, ex: it.ex, status: 'skipday', reason });
    } else if (st === 'partial') {
      for (let n = 1; n <= it.sets; n++) {
        const s = setOf(T.D, m.id, wk.w, it.slot, n);
        const ss = setState(s);
        if (ss !== 'done' && ss !== 'skip') enqueue({ t: 'set', meso: m.id, week: wk.w, slot: it.slot, n, ex: it.ex, kg: s ? s.kg : '', reps: s ? s.reps : '', status: 'skipday', reason });
      }
    }
  }));
  renderT(true);
};
ACT['t.undoSkipDay'] = (ds) => {
  const wk = curWeek(), m = curMeso();
  tx(() => resolveDay(T.D, m, wk.w, ds.day).forEach((it) => undoSkips(m, wk, it, 'skipday')));
  renderT(true);
};
function undoSkips(m, wk, it, kind) {
  const e = entryOf(T.D, m.id, wk.w, it.slot);
  if (e && e.status === kind) enqueue({ t: 'entry', meso: m.id, week: wk.w, slot: it.slot, day: it.day, ex: it.ex, status: '', reason: '' });
  for (let n = 1; n <= it.sets; n++) {
    const s = setOf(T.D, m.id, wk.w, it.slot, n);
    if (s && s.status === kind) enqueue({ t: 'set', meso: m.id, week: wk.w, slot: it.slot, n, ex: s.ex || it.ex, kg: s.kg, reps: s.reps, status: (s.kg || s.reps) ? 'done' : '', reason: '' });
  }
}

/* ---------- exercises of the day ---------- */
function renderDay(keepScroll) {
  const D = T.D, wk = curWeek(), m = curMeso();
  const d = m.days.find((x) => x.id === T.ui.day);
  if (!d) { T.ui.screen = 'week'; return renderWeek(); }
  hdr({ title: 'W' + wk.g + ' • ' + d.name, back: true, home: true, undo: true, right: syncPill() });
  const items = orderedItems(D, m, wk.w, d.id);
  main(`${items.length > 1 ? `<div class="rowbar"><span></span><button class="pill ${T.ui.reorder ? 'blue' : ''}" data-a="t.reorder">${T.ui.reorder ? 'DONE' : 'REORDER'}</button></div>` : ''}
    ${items.map((it, i) => exCard(D, m, wk, it, i, items.length)).join('') || '<div class="empty"><p>No exercises in this day.</p></div>'}`, keepScroll);
}
function exCard(D, m, wk, it, i, total) {
  const ex = exInfo(D, it.ex);
  const st = exStatus(D, m.id, wk.w, it);
  const e = entryOf(D, m.id, wk.w, it.slot);
  let skipReason = st === 'skip' ? ((e && e.reason) || '') : '', exSkipSets = false;
  for (let n = 1; n <= it.sets; n++) { const s = setOf(D, m.id, wk.w, it.slot, n); if (s && s.status === 'skipex') { exSkipSets = true; skipReason = skipReason || s.reason; } }
  const entrySkip = e && e.status === 'skip';
  const fin = exFinished(D, m.id, wk.w, it);
  const badge = st === 'skip' ? 'SKIP' : st === 'done' ? '✓' : st === 'partial' ? doneSets(D, m.id, wk.w, it) + '/' + it.sets : esc(it.sets + ' × ' + it.reps);
  let acts = '';
  if (T.ui.reorder) {
    acts = `<button class="sq" data-a="t.up" data-slot="${esc(it.slot)}" ${i === 0 ? 'disabled' : ''} aria-label="Move up">▲</button>
            <button class="sq" data-a="t.down" data-slot="${esc(it.slot)}" ${i === total - 1 ? 'disabled' : ''} aria-label="Move down">▼</button>`;

/* ---------- editor ---------- */
function newEd(m, slots) {
  return { id: m.id, key: C.tr, status: m.status, num: m.num, title: m.title, weeks: m.weeks, startWeek: m.startWeek,
           days: m.days.map((d) => ({ id: d.id, name: d.name })), origDays: m.days.map((d) => d.id), slots,
           eff: {}, dirty: false, saving: false, again: false, version: 0, err: '', undo: [], redo: [], snap: '', lastPush: 0 };
}
function edSnap(ed) { return JSON.stringify({ title: ed.title, weeks: ed.weeks, days: ed.days, slots: ed.slots }); }
function edRestore(ed, str) {
  const v = JSON.parse(str);
  ed.title = v.title; ed.weeks = v.weeks; ed.days = v.days; ed.slots = v.slots;
  ed.snap = str;
  ed.dirty = true;
  ed.version++;
  renderEditor(true);
  if (ed.status === 'draft') { clearTimeout(C.saveTimer); C.saveTimer = setTimeout(() => saveDraft(ed), 600); }
  updateUndoBtns();
}
function edUndo() { const ed = C.ed; if (!ed || C.screen !== 'editor' || !ed.undo.length) return; ed.redo.push(ed.snap); edRestore(ed, ed.undo.pop()); toast('Undone'); }
function edRedo() { const ed = C.ed; if (!ed || C.screen !== 'editor' || !ed.redo.length) return; ed.undo.push(ed.snap); edRestore(ed, ed.redo.pop()); toast('Redone'); }

function openEditor(id) {
  const m = C.D.mesoById[id];
  if (!m) { toast('Mesocycle not found'); return renderTraineePage(); }
  let slots = [];
  const ed = newEd(m, slots);
  if (m.status === 'draft') {
    slots = (C.D.planByMeso[m.id] || []).filter((p) => p.ex).map((p) => ({ slot: p.slot, day: p.day, pos: p.pos, ex: p.ex, sets: p.sets, reps: p.reps, note: p.note, rir: p.rir || '' }));
  } else {
    m.days.forEach((d) => {
      const fw = firstEditableWeek(C.D, m, d.id);
      ed.eff[d.id] = fw;
      resolveDay(C.D, m, Math.min(fw, m.weeks), d.id).filter((it) => !it.stale)
        .forEach((it) => slots.push({ slot: it.slot, day: d.id, pos: it.pos, ex: it.ex, sets: it.sets, reps: it.reps, note: it.note, rir: it.rir || '' }));
    });
  }
  ed.slots = slots;
  normPos(ed);
  ed.snap = edSnap(ed);
  C.ed = ed;
  if (C.screen !== 'editor') Nav.push();
  C.screen = 'editor';
  renderEditor();
}
ACT['c.openMeso'] = async (ds) => {
  main('<div class="spin"></div>');
  try { await loadTrainee(C.tr); } catch (err) { toast(errText(err)); }
  openEditor(ds.id);
};

function normPos(ed) {
  ed.days.forEach((d) => {
    ed.slots.filter((s) => s.day === d.id).sort((a, b) => a.pos - b.pos).forEach((s, i) => { s.pos = i + 1; });
  });
}

function edValidate(ed) {
  if (!ed.days.length) return 'Add at least one day.';
  for (const s of ed.slots) if (!/^\d{1,2}(-\d{1,2})?$/.test(s.reps)) return `Fix the reps "${s.reps}" (example: 8-10).`;
  for (const s of ed.slots) if (s.rir && !/^\d(-\d)?$/.test(s.rir)) return `Fix the target RIR "${s.rir}" (example: 2 or 0-2).`;
  return '';
}

function renderEditor(keepScroll) {
  const ed = C.ed;
  const pub = ed.status === 'published';
  hdr({ title: `M${ed.num} · ${pub ? 'PUBLISHED' : 'DRAFT'}`, back: true, home: true, undo: true });
  const days = ed.days.map((d, di) => {
    const slots = ed.slots.filter((s) => s.day === d.id).sort((a, b) => a.pos - b.pos);
    const isNew = ed.origDays.indexOf(d.id) < 0;
    const canDel = !pub || isNew;
    let eff = '';
    if (pub && !isNew) {
      const fw = ed.eff[d.id] || 1;
      eff = fw > ed.weeks ? `<div class="warn">All weeks already logged — edits won’t apply.</div>` : `<div class="info">Edits apply from week ${ed.startWeek + fw - 1}.</div>`;
    }
    const folded = !!(ed.folded && ed.folded[d.id]);
    const setsN = slots.reduce((a, x) => a + x.sets, 0);
    return `<div class="card edday">
      <div class="edday-h">
        <button class="sq" data-a="c.dayFold" data-day="${esc(d.id)}" aria-label="Show or hide exercises">${folded ? '▸' : '▾'}</button>
        <select class="in" data-ch="c.dayNameSel" data-day="${esc(d.id)}" aria-label="Day name">${dayOptions(d.name)}</select>
      </div>
      ${folded ? `<div class="sub">${slots.length} exercises · ${setsN} sets</div>` : `
      <div class="edday-a">
        <button class="sq" data-a="c.dayMove" data-day="${esc(d.id)}" data-dir="-1" ${di === 0 ? 'disabled' : ''} aria-label="Move day up">▲</button>
        <button class="sq" data-a="c.dayMove" data-day="${esc(d.id)}" data-dir="1" ${di === ed.days.length - 1 ? 'disabled' : ''} aria-label="Move day down">▼</button>
        <button class="sq" data-a="c.dayDup" data-day="${esc(d.id)}" aria-label="Duplicate day">⧉</button>
        ${canDel ? `<button class="sq red" data-a="c.dayDel" data-day="${esc(d.id)}" aria-label="Delete day">✕</button>` : ''}
      </div>${eff}
      ${slots.map((x, i) => slotRow(x, i, slots.length)).join('')}
      <button class="btn ghost sm" data-a="c.addSlot" data-day="${esc(d.id)}">+ ADD EXERCISE</button>`}</div>`;
  }).join('');

  const latestPub = C.D.mesos[C.D.mesos.length - 1];
  const canDelete = !pub || (latestPub && latestPub.id === ed.id && !mesoHasLogs(C.D, ed.id));
  main(`${isSelfTr() ? '' : trSelect()}<div class="savebar" id="saveBar">${saveText()}</div>
    <div class="lbl" style="margin-top:0">Title (optional)</div><input class="in" value="${esc(ed.title)}" maxlength="60" data-in="c.title" placeholder="e.g. Base block">
    <div class="lbl">Weeks</div>
    ${pub ? `<div class="muted">${ed.weeks} weeks · Weeks ${ed.startWeek}–${ed.startWeek + ed.weeks - 1}</div>`
          : `<div class="row"><button class="sq" data-a="c.weeks" data-dir="-1" ${ed.weeks <= 1 ? 'disabled' : ''}>−</button><b style="min-width:70px;text-align:center">${ed.weeks} weeks</b><button class="sq" data-a="c.weeks" data-dir="1" ${ed.weeks >= 12 ? 'disabled' : ''}>+</button></div>`}
    <div class="lbl">Days</div>${days}

function saveText() {
  const ed = C.ed;
  if (!ed) return '';
  const v = edValidate(ed);
  if (v) return `<span class="savebar bad">${esc(v)}</span>`;
  if (ed.status === 'published') return ed.dirty ? 'Unsaved changes' : 'No changes';
  if (ed.err) return `<span class="savebar bad">Not saved: ${esc(ed.err)}</span>`;
  if (ed.saving || ed.dirty) return 'Saving…';
  return 'All changes saved ✓';
}
function updateSaveBar() {
  const b = $('#saveBar');
  if (b) b.innerHTML = saveText();
  const pb = $('#savePubBtn');
  if (pb) pb.disabled = !C.ed.dirty;
}

function edChanged(structural) {
  const ed = C.ed;
  if (structural) normPos(ed);
  const now = edSnap(ed);
  if (ed.snap && now !== ed.snap) {
    const t = Date.now();
    if (structural || t - ed.lastPush > 1500) { ed.undo.push(ed.snap); if (ed.undo.length > 60) ed.undo.shift(); ed.lastPush = t; }
    ed.redo = [];
  }
  ed.snap = now;
  updateUndoBtns();
  ed.dirty = true;
  ed.version++;
  if (structural) { normPos(ed); renderEditor(true); } else updateSaveBar();
  if (ed.status === 'draft') { clearTimeout(C.saveTimer); C.saveTimer = setTimeout(() => saveDraft(ed), 900); }
}

async function saveDraft(ed) {
  if (ed.status !== 'draft') return;
  if (ed.saving) { ed.again = true; return; }
  if (!ed.dirty) return;
  if (edValidate(ed)) { if (C.ed === ed) updateSaveBar(); return; }
  ed.saving = true;
  ed.err = '';
  const v = ed.version;
  if (C.ed === ed) updateSaveBar();
  let retry = 0;
  try {
    const res = await coachPost({ t: 'saveMeso', key: ed.key, meso: edPayload(ed) });
    ed.id = res.meso.id;
    ed.num = res.meso.num;
    if (ed.version === v) ed.dirty = false;
  } catch (err) {
    ed.err = errText(err);
    if (err.code === 'network') retry = 5000;
  }
  ed.saving = false;
  if (C.ed === ed) updateSaveBar();
  if (ed.again || (ed.dirty && !ed.err)) { ed.again = false; setTimeout(() => saveDraft(ed), 200); }
  else if (retry) setTimeout(() => saveDraft(ed), retry);
}

function edPayload(ed) {
  return { id: ed.id || '', title: ed.title, weeks: ed.weeks, days: ed.days,
           slots: ed.slots.map((s) => ({ slot: s.slot, day: s.day, pos: s.pos, ex: s.ex, sets: s.sets, reps: s.reps, note: s.note, rir: s.rir || '' })) };
}

async function waitSaved(ed, ms) {
  const t0 = Date.now();
  while ((ed.saving || ed.dirty) && Date.now() - t0 < ms) {
    if (!ed.saving && ed.dirty && !ed.err && !edValidate(ed)) { clearTimeout(C.saveTimer); saveDraft(ed); }
    if (ed.err && !ed.saving) break;
    if (edValidate(ed)) break;
    await new Promise((r) => setTimeout(r, 150));
  }
  return !ed.saving && !ed.dirty;
}

async function leaveEditor(reload = true) {
  const ed = C.ed;
  if (!ed) { if (reload) { try { await loadTrainee(C.tr); } catch (_) { /* keep old data */ } } return true; }
  if (ed.status === 'draft') {
    if (ed.dirty || ed.saving) {
      $('#saveBar') && ($('#saveBar').innerHTML = 'Saving…');
      const ok = await waitSaved(ed, 15000);
      if (!ok) {
        const leave = await confirmBox('Not saved', edValidate(ed) || ed.err || 'Your last changes are not saved yet.', 'LEAVE ANYWAY', true);
        if (!leave) return false;
      }
    }
  } else if (ed.dirty) {
    const leave = await confirmBox('Discard changes?', 'You have unsaved changes.', 'DISCARD', true);
    if (!leave) return false;
  }
  C.ed = null;
  if (reload) { try { await loadTrainee(C.tr); } catch (_) { /* keep old data */ } }
  return true;
}

    <div class="lbl">Target RIR (optional)</div><input class="in ririn wide" id="ppRir" maxlength="3" placeholder="2 or 0-2">
    <div class="err" id="ppErr"></div>
    <button class="btn" data-a="c.ppAdd" data-id="${esc(x.id)}">ADD</button><button class="btn ghost" data-a="c.libBack">CANCEL</button>`);
}
ACT['c.ppAdd'] = async (ds, el) => {
  const L = C.lib;
  const x = libFind(ds.id);
  const rir = ($('#ppRir').value || '').trim();
  if (rir && !/^\d(-\d)?$/.test(rir)) { $('#ppErr').textContent = 'Target RIR looks like 2 or 0-2.'; return; }
  const done = (id) => { closeModal(); C.lib = null; if (L && L.onPick) L.onPick(id, { rir }); };
  if (x && x.mine) return done(x.id);
  const machine = $('#ppMachine').value.trim(), seat = $('#ppSeat').value.trim();
  if (!machine && !seat) return done(ds.id);
  const same = (C.dash.myExercises || []).find((w) => w.base === ds.id && (w.machine || '').toLowerCase() === machine.toLowerCase() && (w.seat || '').toLowerCase() === seat.toLowerCase());
  if (same) return done(same.id);
  el.disabled = true;
  try {
    const res = await coachPost({ t: 'saveMyExercise', base: ds.id, machine, seat });
    const w = res.exercise;
    C.dash.myExercises.push(w);
    C.exMap[w.id] = w;
    if (C.D) C.D.exMap[w.id] = w;
    done(w.id);
  } catch (err) { $('#ppErr').textContent = errText(err); el.disabled = false; }
};
function variantForm(x) {
  openModal(`<h3>Edit my exercise</h3><p class="sub">${esc(x.baseName || '')}</p>
    <div class="lbl">Machine name</div><input class="in" id="vfMachine" maxlength="40" value="${esc(x.machine || '')}">
    <div class="lbl">Seat setting</div><input class="in" id="vfSeat" maxlength="20" value="${esc(x.seat || '')}">
    <p class="sub">Its logged history stays with it.</p>
    <div class="err" id="vfErr"></div>
    <button class="btn" data-a="c.vfSave" data-id="${esc(x.id)}">SAVE</button><button class="btn ghost" data-a="c.libBack">CANCEL</button>`);
}
ACT['c.vfSave'] = async (ds, el) => {
  const x = libFind(ds.id);
  if (!x) return;
  const machine = $('#vfMachine').value.trim(), seat = $('#vfSeat').value.trim();
  if (!machine && !seat) { $('#vfErr').textContent = 'Enter the machine name or the seat setting.'; return; }
  el.disabled = true;
  try {
    const res = await coachPost({ t: 'saveMyExercise', id: x.id, base: x.base, machine, seat, active: x.active });
    Object.assign(x, res.exercise);
    C.exMap[x.id] = x;
    if (C.D) C.D.exMap[x.id] = x;
    closeModal();
    toast('Saved');
    reopenLib();
  } catch (err) { $('#vfErr').textContent = errText(err); el.disabled = false; }
};

function exForm(x, name, part) {
  const parts = C.dash.parts || [];
  const cur = x ? x.muscle : (part || '');
  const also = x ? (x.also || '') : '';
  const o = (v, sel, label) => `<option value="${esc(v)}" ${v === sel ? 'selected' : ''}>${esc(label || v)}</option>`;
  openModal(`<h3>${x ? 'Edit exercise' : 'New exercise'}</h3>
    <div class="lbl">Name</div><input class="in" id="exName" maxlength="80" value="${esc(x ? x.name : name || '')}">
    <div class="lbl">Muscle part</div><select class="in" id="exPart">${parts.indexOf(cur) < 0 ? o('', '', '— choose —') : ''}${parts.map((pt) => o(pt, cur)).join('')}</select>
    <div class="lbl">Also listed in (optional)</div><select class="in" id="exAlso">${o('', also, '—')}${parts.map((pt) => o(pt, also)).join('')}</select>
    <div class="lbl">Video link (optional)</div><input class="in" id="exVideo" maxlength="500" placeholder="https://…" value="${esc(x ? x.video : '')}">
    <label class="check"><input type="checkbox" id="exPrime" ${x && x.prime ? 'checked' : ''}> Prime (two weight boxes)</label>
    ${x ? `<label class="check"><input type="checkbox" id="exActive" ${x.active ? 'checked' : ''}> Show in the list</label>
           <p class="sub">Renaming keeps all logged history — it stays the same exercise.</p>` : ''}
    <div class="err" id="exErr"></div>
    <button class="btn" data-a="c.saveEx" data-id="${x ? esc(x.id) : ''}">SAVE</button><button class="btn ghost" data-a="c.libBack">CANCEL</button>`);
}
ACT['c.saveEx'] = async (ds, el) => {
  const op = { t: 'saveExercise', id: ds.id || '', name: $('#exName').value.trim(), muscle: $('#exPart').value, also: $('#exAlso').value,
               video: $('#exVideo').value.trim(), prime: $('#exPrime').checked, active: $('#exActive') ? $('#exActive').checked : true };
  if (!op.name) { $('#exErr').textContent = 'Name is required.'; return; }
  if (!op.muscle) { $('#exErr').textContent = 'Choose the muscle part.'; return; }
  if (op.also === op.muscle) op.also = '';
  if (op.video && !/^https?:\/\//i.test(op.video)) { $('#exErr').textContent = 'The video must be a link starting with https://'; return; }
  el.disabled = true;
  try {
    const res = await coachPost(op);
    const x = res.exercise;
    const i = C.dash.exercises.findIndex((e) => e.id === x.id);
    if (i >= 0) C.dash.exercises[i] = x; else C.dash.exercises.push(x);
    C.exMap[x.id] = x;
    if (C.D) C.D.exMap[x.id] = x;
    closeModal();
    toast('Saved');
    const L = C.lib;
    if (L && L.mode === 'pick' && !ds.id) { C.lib = null; if (L.onPick) L.onPick(x.id); }
    else if (L && L.mode === 'pick') reopenLib();
    else if (C.screen === 'exercises' && L) { L.open[x.muscle] = true; renderLibList(); }
    else if (C.screen === 'editor') renderEditor(true);
  } catch (err) { $('#exErr').textContent = errText(err); el.disabled = false; }
};

ACT['c.exList'] = () => { C.screen = 'exercises'; Nav.push(); hdr({ title: 'EXERCISES', back: true, home: true }); openLibrary('manage'); };

/* ---------- weekly review (read logs + write coach notes) ---------- */
ACT['c.review'] = async () => {
  main('<div class="spin"></div>');
  try { await loadTrainee(C.tr); } catch (err) { toast(errText(err)); }
  C.screen = 'review';
  C.rv = { wi: currentWeekIndex(C.D), drafts: {} };
  Nav.push();
  renderReview();
};
function renderReview(keepScroll) {
  const D = C.D;
  hdr({ title: 'REVIEW · ' + (trOf(C.tr) || D.trainee).name, back: true, home: true });
  if (!D.weeks.length) return main('<div class="empty"><p>No published mesocycle.</p></div>');
  const wk = D.weeks[C.rv.wi], m = D.mesoById[wk.meso];
  const opts = D.weeks.map((x, i) => `<option value="${i}" ${i === C.rv.wi ? 'selected' : ''}>WEEK ${x.g} · M${D.mesoById[x.meso].num}</option>`).join('');
  const days = m.days.map((d) => {
    const items = resolveDay(D, m, wk.w, d.id);
    const st = dayStatus(D, m, wk.w, d.id);
    return `<div class="box review st-${st}"><div class="ttl">${esc(d.name)}</div>` + items.map((it) => {
      const e = entryOf(D, m.id, wk.w, it.slot) || {};
      const est = exStatus(D, m.id, wk.w, it);
      let sets = '';
      for (let n = 1; n <= it.sets; n++) {
        const s = setOf(D, m.id, wk.w, it.slot, n);
        const ss = setState(s);
        sets += `<span class="tag ${ss === 'done' ? 'green' : ss === 'skip' ? 'red' : ''}">${ss === 'skip' ? 'SKIP' : ss === 'empty' ? '—' : esc((s.kg || '—') + '×' + (s.reps || '—'))}</span>`;
      }
      const reasons = [];
      if ((e.status === 'skip' || e.status === 'skipday') && e.reason) reasons.push('Skipped: ' + e.reason);
      for (let n = 1; n <= it.sets; n++) { const s = setOf(D, m.id, wk.w, it.slot, n); if (s && isSkip(s.status) && s.reason && reasons.indexOf('Skipped set: ' + s.reason) < 0) reasons.push('Skipped set: ' + s.reason); }
      const k = ek(m.id, wk.w, it.slot);
      const draft = k in C.rv.drafts ? C.rv.drafts[k] : (e.cnote || '');
      const order = e.order && e.order !== it.planned ? ` <span class="tag amber">DONE #${e.order}</span>` : '';
      return `<div class="it"><div class="row"><b class="grow">${it.planned}. ${esc(exInfo(D, it.ex).name)}</b><span class="tag ${est === 'done' ? 'green' : est === 'skip' ? 'red' : ''}">${esc(it.sets + '×' + it.reps)}</span>${order}</div>
        <div class="chipline">${sets}</div>
        ${reasons.map((r) => `<div class="sub" style="color:#fca5a5">${esc(r)}</div>`).join('')}
        ${e.tnote ? `<div class="sub">Trainee: ${esc(e.tnote)}</div>` : ''}
        <div class="row" style="margin-top:6px"><input class="in note" placeholder="Coach note for this week…" value="${esc(draft)}" maxlength="1000" data-in="c.rvNote" data-k="${esc(k)}">
        <button class="pill blue" data-a="c.rvSave" data-slot="${esc(it.slot)}" data-k="${esc(k)}">SAVE</button></div></div>`;
    }).join('') + '</div>';
  }).join('');
  main(`<select class="wsel in" data-ch="c.rvWeek" style="margin-bottom:10px">${opts}</select>
    <p class="dim" style="font-size:12px;margin-top:0">A coach note shows under the exercise in the trainee’s app from this week on, until you write a new one.</p>${days}`, keepScroll);
}
CHG['c.rvWeek'] = (el) => { C.rv.wi = +el.value; renderReview(); };
INP['c.rvNote'] = (el) => { C.rv.drafts[el.dataset.k] = el.value; };
ACT['c.rvSave'] = async (ds, el) => {
  const D = C.D, wk = D.weeks[C.rv.wi], m = D.mesoById[wk.meso];
  const it = m.days.reduce((a, d) => a.concat(resolveDay(D, m, wk.w, d.id)), []).find((x) => x.slot === ds.slot);
  const existing = (D.entries[ds.k] || {}).cnote || '';
  const text = (ds.k in C.rv.drafts ? C.rv.drafts[ds.k] : existing).trim();
  el.disabled = true;
  try {
    await coachPost({ t: 'coachNote', key: C.tr, meso: m.id, week: wk.w, slot: ds.slot, ex: it ? it.ex : '', text });
    const e = D.entries[ds.k] || { meso: m.id, week: wk.w, slot: ds.slot, day: it ? it.day : '', ex: it ? it.ex : '', order: 0, status: '', reason: '', tnote: '', cnote: '' };
    e.cnote = text;
    D.entries[ds.k] = e;
    delete C.rv.drafts[ds.k];
    toast('Note saved');
  } catch (err) { toast(errText(err)); }
  el.disabled = false;
};

/* ======================================================================
   BOOT
   ====================================================================== */
(function boot() {
  const p = new URLSearchParams(location.search);
  const k = (p.get('k') || '').trim();
  const c = (p.get('c') || '').trim();
  if (c) return bootCoach(c);
  if (k) return bootTrainee(k);
  if (LOCAL) return bootCoach(window.HJ_LOCAL.coachKey());
  renderMessage('Link not valid', 'Open the app using the link your coach sent you.');
})();
</script>
</body>
