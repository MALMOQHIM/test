<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0e0e11">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Hajime">
<title>Hajime</title>
<style>
:root{--bg:#0e0e11;--card:#18181b;--card2:#1f1f25;--line:#2a2a32;--text:#f2f2f4;--muted:#a0a0aa;--dim:#6b6b75;
--blue:#3b82f6;--green:#22c55e;--red:#ef4444;--amber:#f59e0b;--gray:#8b8b95}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--text);font:15px/1.4 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Noto Sans Arabic",sans-serif}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;touch-action:manipulation}
button:disabled{opacity:.35;cursor:default}
.hdr{position:sticky;top:0;z-index:5;display:flex;align-items:center;gap:6px;padding:calc(10px + env(safe-area-inset-top)) 10px 10px;background:#18181b;border-bottom:1px solid #27272a}
.hgrp{display:flex;gap:6px;align-items:center;flex:none}
.hbtn{height:34px;min-width:34px;padding:0 9px;border-radius:8px;border:none;background:#27272a;color:#a1a1aa;font-size:17px;font-weight:800;line-height:1}
.hbtn.txt{font-size:11px;letter-spacing:.04em}
.hbtn:disabled{opacity:.3}
.htitle{flex:1;min-width:0;text-align:center;font-weight:800;letter-spacing:.06em;text-transform:uppercase;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.wrap{max-width:560px;margin:0 auto;padding:12px 14px calc(40px + env(safe-area-inset-bottom))}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px;margin:0 0 10px;display:flex;align-items:center;gap:10px}
.card[data-a]{cursor:pointer}
.grow{flex:1;min-width:0}
.ttl{font-weight:700}
.sub{color:var(--muted);font-size:13px;margin-top:2px}
.muted{color:var(--muted)}
.row{display:flex;gap:8px;align-items:center}
.lbl{font-size:11px;color:var(--muted);letter-spacing:.1em;font-weight:700;text-transform:uppercase;margin:14px 0 6px}
.box{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px;margin-bottom:10px}
.in,.ta,select.in{background:var(--card2);border:1px solid var(--line);border-radius:12px;padding:11px 12px;width:100%;outline:none}
.in:focus,.ta:focus{border-color:var(--blue)}
.ta{min-height:90px;resize:vertical}
.btn{display:block;width:100%;border:none;border-radius:12px;padding:14px;font-weight:800;letter-spacing:.06em;background:var(--blue);color:#fff;margin:8px 0}
.btn.ghost{background:transparent;border:1px solid var(--line);color:var(--text)}
.btn.danger{background:transparent;border:1px solid #5b2323;color:#fca5a5}
.btn.sm{padding:10px;font-size:13px;margin:6px 0 0}
.pill{border:1px solid var(--line);background:var(--card2);border-radius:999px;padding:6px 11px;font-size:12px;font-weight:700;letter-spacing:.04em;white-space:nowrap}
.pill.red{color:#fca5a5;border-color:#5b2323}
.pill.blue{background:var(--blue);border-color:var(--blue)}
.sq{width:34px;height:34px;flex:none;border-radius:9px;border:1px solid var(--line);background:var(--card2);display:inline-flex;align-items:center;justify-content:center}
.empty{text-align:center;padding:40px 20px;color:var(--muted)}
.spin{width:30px;height:30px;border:3px solid var(--line);border-top-color:var(--blue);border-radius:50%;animation:sp 1s linear infinite;margin:60px auto}
@keyframes sp{to{transform:rotate(360deg)}}
.toast{position:fixed;left:50%;bottom:calc(22px + env(safe-area-inset-bottom));transform:translateX(-50%) translateY(20px);background:#26262d;border:1px solid var(--line);padding:10px 16px;border-radius:12px;opacity:0;pointer-events:none;transition:.25s;z-index:30;max-width:90vw;text-align:center}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:20;display:flex;align-items:flex-end;justify-content:center}
.modal[hidden]{display:none}
.sheet{background:#141418;border:1px solid var(--line);border-radius:18px 18px 0 0;width:100%;max-width:560px;max-height:88vh;overflow:auto;padding:16px 16px calc(18px + env(safe-area-inset-bottom))}
.sheet h3{margin:2px 0 10px;font-size:15px;letter-spacing:.08em;text-transform:uppercase}
.err{color:#fca5a5;font-size:13px;min-height:18px;margin:6px 2px}
/* lists: two shades of the same colour so rows are easy to tell apart */
.list .card:nth-child(odd){background:#17171b}
.list .card:nth-child(even){background:#1f1f25}
.grpttl{display:flex;justify-content:space-between;align-items:center;font-size:11px;font-weight:800;letter-spacing:.12em;color:var(--muted);margin:16px 2px 8px}
.ind{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}
.chip{font-size:11px;font-weight:800;letter-spacing:.04em;border-radius:7px;padding:4px 8px;background:#27272a;color:#d4d4d8;white-space:nowrap}
.chip.green{background:rgba(34,197,94,.16);color:#86efac}
.chip.amber{background:rgba(245,158,11,.16);color:#fcd34d}
.chip.red{background:rgba(239,68,68,.16);color:#fca5a5}
.chip.blue{background:rgba(59,130,246,.16);color:#93c5fd}
.badge{min-width:26px;height:26px;border-radius:999px;background:var(--red);color:#fff;font-size:12px;font-weight:900;display:flex;align-items:center;justify-content:center;padding:0 7px}
.task{display:flex;gap:8px;align-items:flex-start;padding:10px 0;border-top:1px solid var(--line)}
.task:first-child{border-top:none}
.task.closed{opacity:.5}
.tabs{display:flex;gap:8px;margin-bottom:12px}
.tab{flex:1;position:relative;border:1px solid var(--line);background:var(--card);border-radius:12px;padding:10px 6px;font-size:11px;font-weight:800;letter-spacing:.06em;color:var(--muted)}
.tab.on{background:var(--blue);border-color:var(--blue);color:#fff}
.tab .cnt{display:block;font-size:17px;margin-top:2px;color:inherit}
.tab .dot{position:absolute;top:6px;right:8px;width:9px;height:9px;border-radius:50%;background:var(--red)}
.sec{border:1px solid var(--line);border-radius:12px;margin-bottom:8px;overflow:hidden}
.sec-h{width:100%;display:flex;justify-content:space-between;align-items:center;padding:12px;background:var(--card);border:none;font-weight:800;letter-spacing:.04em;text-align:left;color:var(--text)}
.sec-b{padding:0 12px 10px;background:var(--card)}
.item{display:flex;align-items:center;gap:8px;padding:11px 4px;border-bottom:1px solid var(--line);cursor:pointer}
.item:last-child{border-bottom:none}
.edday{display:block}
.edday-h{display:flex;gap:6px;align-items:center;margin-bottom:8px}
.edday-h .in{flex:1;min-width:0;padding:9px 10px;font-weight:800}
.edday-a{display:flex;gap:6px;justify-content:flex-end;margin:-2px 0 6px}
.slot{border-top:1px solid var(--line);padding:10px 0}
.slot-h{display:flex;gap:6px;align-items:center}
.num{min-width:26px;height:26px;border-radius:8px;background:var(--card2);display:flex;align-items:center;justify-content:center;font-weight:700;font-size:13px}
.exbtn{flex:1;min-width:0;text-align:left;background:var(--card2);border:1px solid var(--line);border-radius:10px;padding:8px 10px;font-weight:700;white-space:normal;line-height:1.3}
.slot-b{display:flex;gap:6px;align-items:center;flex-wrap:wrap;margin:8px 0}
.slot-f{display:flex;gap:6px;align-items:center}
.slot-f .in{flex:1;min-width:0;padding:8px 10px;font-size:14px}
.slot-f .sq{width:30px;height:30px;font-size:12px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:10px;overflow:hidden}
.seg button{border:none;background:var(--card2);padding:8px 10px;font-weight:700;font-size:13px;border-right:1px solid var(--line);color:var(--text)}
.seg button:last-child{border-right:none}
.seg button.on{background:var(--blue)}
.seg.wide{display:flex;width:100%}.seg.wide button{flex:1;padding:10px 0}
.opt{display:block;width:100%;text-align:left;padding:12px;border-radius:12px;border:1px solid var(--line);background:var(--card);margin-bottom:6px;font-weight:700;color:var(--text)}
.opt.on{border-color:var(--blue);box-shadow:0 0 0 1px var(--blue) inset}
.in.reps{width:74px;padding:8px}
.savebar{font-size:12px;color:var(--muted);text-align:center;margin:4px 0 10px}
.savebar.bad{color:#fca5a5}
.sumgrid{display:grid;grid-template-columns:1fr 1fr;gap:0 14px}
.sumrow{display:flex;justify-content:space-between;padding:6px 0;border-bottom:1px solid var(--line);font-size:14px}
.sumday{border-top:1px solid var(--line);padding:8px 0}
.sumline{display:flex;justify-content:space-between;gap:10px;font-size:13px;padding:2px 0}
.tag{font-size:11px;font-weight:800;border-radius:6px;padding:3px 7px;background:var(--card2);color:var(--muted)}
.tag.green{background:rgba(34,197,94,.16);color:#86efac}.tag.amber{background:rgba(245,158,11,.16);color:#fcd34d}
.logo{font-size:26px;font-weight:900;letter-spacing:2px;color:var(--blue);text-align:center;margin:40px 0 6px}
.center{text-align:center}
</style>
</head>
<body>
<header class="hdr">
  <div class="hgrp"><button class="hbtn txt" id="hBack" data-a="nav.back" hidden>BACK</button></div>
  <div class="htitle" id="hTitle">HAJIME</div>
  <div class="hgrp" id="hRight"></div>
</header>
<main class="wrap" id="main"><div class="spin"></div></main>
<div class="modal" id="modal" hidden><div class="sheet" id="sheet"></div></div>
<div class="toast" id="toast"></div>

<script>
'use strict';
/* ======================================================================
   CONNECTION
   ====================================================================== */
const CONFIG = {
  SUPABASE_URL: 'https://bldcowifxcknywoocwgb.supabase.co',
  SUPABASE_KEY: 'sb_publishable_CpfquGZbJ6XRCp4KKXZnXg_zwl3yJ42'
};

/* ---------------- helpers ---------------- */
const $ = (s) => document.querySelector(s);
const esc = (s) => String(s == null ? '' : s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const LS = {
  get(k, d) { try { const v = localStorage.getItem(k) ?? sessionStorage.getItem(k); return v == null ? d : JSON.parse(v); } catch (_) { return d; } },
  set(k, v, session) { try { (session ? sessionStorage : localStorage).setItem(k, JSON.stringify(v)); } catch (_) {} },
  del(k) { try { localStorage.removeItem(k); sessionStorage.removeItem(k); } catch (_) {} }
};
class AppError extends Error { constructor(code, msg) { super(msg); this.code = code; } }
let toastTimer = null;
function toast(msg) {
  const t = $('#toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.classList.remove('show'), 2600);
}
function main(html) { $('#main').innerHTML = html; window.scrollTo(0, 0); }
function hdr(o) {
  $('#hTitle').textContent = o.title || 'HAJIME';
  $('#hBack').hidden = !o.back;
  $('#hRight').innerHTML = o.right || '';
}
function openModal(html) { $('#sheet').innerHTML = html; $('#modal').hidden = false; }
function closeModal() { $('#modal').hidden = true; $('#sheet').innerHTML = ''; }
const Modal = { resolve: null };
function modalDone(v) { const r = Modal.resolve; Modal.resolve = null; closeModal(); if (r) r(v); }
function confirmBox(title, text, ok, danger) {
  return new Promise((res) => {
    Modal.resolve = res;
    openModal(`<h3>${esc(title)}</h3><p class="muted">${esc(text)}</p>
      <button class="btn ${danger ? 'danger' : ''}" data-a="modal.yes">${esc(ok || 'OK')}</button>
      <button class="btn ghost" data-a="modal.no">CANCEL</button>`);
  });
}

/* ---------------- dates: weeks run Sunday → Saturday ---------------- */
function today() { const d = new Date(); return ymd(d); }
function ymd(d) { return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0'); }
function parseYmd(s) { const p = String(s).split('-').map(Number); return new Date(p[0], p[1] - 1, p[2]); }
function weekStart(s) { const d = parseYmd(s || today()); d.setDate(d.getDate() - d.getDay()); return ymd(d); }
function addDays(s, n) { const d = parseYmd(s); d.setDate(d.getDate() + n); return ymd(d); }
function addMonths(s, n) {
  const p = String(s).split('-').map(Number);
  const i = p[1] - 1 + n, y = p[0] + Math.floor(i / 12), m = ((i % 12) + 12) % 12;
  const dim = new Date(y, m + 1, 0).getDate();
  return y + '-' + String(m + 1).padStart(2, '0') + '-' + String(Math.min(p[2], dim)).padStart(2, '0');
}
function daysBetween(a, b) { return Math.round((parseYmd(b) - parseYmd(a)) / 86400000); }
const GRACE = 2;

/* ======================================================================
   SUPABASE (auth + tables)
   ====================================================================== */
const SB = {
  session: LS.get('hj_sess', null),
  save(s, remember) {
    SB.session = s;
    LS.del('hj_sess');
    if (s) LS.set('hj_sess', s, !remember);
  },
  async call(path, opts = {}) {
    const headers = Object.assign({ apikey: CONFIG.SUPABASE_KEY, 'Content-Type': 'application/json' }, opts.headers || {});
    if (opts.auth !== false && SB.session) headers.Authorization = 'Bearer ' + SB.session.access_token;
    let res;
    try {
      res = await fetch(CONFIG.SUPABASE_URL + path, { method: opts.method || 'GET', headers, body: opts.body ? JSON.stringify(opts.body) : undefined });
    } catch (_) { throw new AppError('network', 'No connection.'); }
    const text = await res.text();
    const data = text ? (() => { try { return JSON.parse(text); } catch (_) { return text; } })() : null;
    if (!res.ok) {
      const msg = (data && (data.message || data.error_description || data.error)) || ('Error ' + res.status);
      throw new AppError(res.status === 401 ? 'auth' : 'server', msg);
    }
    return data;
  },
  async signIn(email, password, remember) {
    const s = await SB.call('/auth/v1/token?grant_type=password', { method: 'POST', auth: false, body: { email, password } });
    SB.save({ access_token: s.access_token, refresh_token: s.refresh_token, expires_at: Date.now() + (s.expires_in || 3600) * 1000, user: s.user }, remember);
    return s;
  },
  async refresh() {
    if (!SB.session || !SB.session.refresh_token) throw new AppError('auth', 'Signed out');
    const s = await SB.call('/auth/v1/token?grant_type=refresh_token', { method: 'POST', auth: false, body: { refresh_token: SB.session.refresh_token } });
    SB.save({ access_token: s.access_token, refresh_token: s.refresh_token || SB.session.refresh_token, expires_at: Date.now() + (s.expires_in || 3600) * 1000, user: s.user }, !sessionStorage.getItem('hj_sess'));
  },
  async ready() {
    if (!SB.session) throw new AppError('auth', 'Signed out');
    if (SB.session.expires_at && SB.session.expires_at - Date.now() < 60000) await SB.refresh();
  },
  signOut() { SB.save(null); },

  async sel(table, q = {}) {
    await SB.ready();
    const p = new URLSearchParams();
    p.set('select', q.select || '*');
    Object.keys(q.eq || {}).forEach((k) => p.set(k, 'eq.' + q.eq[k]));
    (q.filters || []).forEach(([k, v]) => p.append(k, v));
    if (q.order) p.set('order', q.order);
    if (q.limit) p.set('limit', q.limit);
    return SB.call('/rest/v1/' + table + '?' + p.toString());
  },
  async ins(table, rows, onConflict) {
    await SB.ready();
    const p = onConflict ? '?on_conflict=' + onConflict : '';
    return SB.call('/rest/v1/' + table + p, {
      method: 'POST',
      headers: { Prefer: 'return=representation' + (onConflict ? ',resolution=merge-duplicates' : '') },
      body: rows
    });
  },
  async del(table, eq) {
    await SB.ready();
    const p = new URLSearchParams();
    Object.keys(eq).forEach((k) => p.set(k, 'eq.' + eq[k]));
    return SB.call('/rest/v1/' + table + '?' + p.toString(), { method: 'DELETE' });
  },
  async upd(table, eq, patch) {
    await SB.ready();
    const p = new URLSearchParams();
    Object.keys(eq).forEach((k) => p.set(k, 'eq.' + eq[k]));
    return SB.call('/rest/v1/' + table + '?' + p.toString(), { method: 'PATCH', headers: { Prefer: 'return=representation' }, body: patch });
  }
};

/* ======================================================================
   APP STATE
   ====================================================================== */
const A = { me: null, screen: '', dash: null, tr: null, trData: null, showClosed: false };

const ACT = {};
const INP = {};
const CHG = {};
document.addEventListener('click', (ev) => {
  const el = ev.target.closest('[data-a]');
  if (!el || el.disabled || el.id === 'modal') return;
  const fn = ACT[el.dataset.a];
  if (fn) { ev.preventDefault(); ev.stopPropagation(); fn(el.dataset, el); }
});
$('#modal').addEventListener('click', (ev) => { if (ev.target.id === 'modal') { if (Modal.resolve) modalDone(null); else closeModal(); } });
document.addEventListener('input', (ev) => { const el = ev.target.closest('[data-in]'); if (el && INP[el.dataset.in]) INP[el.dataset.in](el); });
document.addEventListener('change', (ev) => { const el = ev.target.closest('[data-ch]'); if (el && CHG[el.dataset.ch]) CHG[el.dataset.ch](el); });
ACT['modal.yes'] = () => modalDone(true);
ACT['modal.no'] = () => modalDone(null);
ACT['nav.back'] = () => back();

async function back() {
  if (A.screen === 'editor') {
    const ed = A.ed;
    if (ed && ed.status === 'draft' && (ed.dirty || ed.saving)) { await saveDraft(ed); }
    A.ed = null;
    A.screen = 'trainee';
    return renderTrainee();
  }
  if (A.screen === 'lib') { A.screen = 'home'; A.lib = null; return renderHome(); }
  if (A.screen === 'trainee') { A.tr = null; A.trData = null; A.screen = 'home'; return renderHome(); }
}

/* ======================================================================
   SIGN IN
   ====================================================================== */
function renderLogin(msg) {
  hdr({ title: 'HAJIME' });
  main(`<div class="logo">HAJIME</div>
    <p class="center muted" style="margin-bottom:20px">Sign in to continue</p>
    <div class="lbl">Email</div><input class="in" id="liEmail" type="email" autocomplete="username" inputmode="email">
    <div class="lbl">Password</div><input class="in" id="liPass" type="password" autocomplete="current-password">
    <label class="row" style="margin:14px 2px"><input type="checkbox" id="liKeep" checked style="width:18px;height:18px"> <span class="muted">Keep me signed in</span></label>
    <div class="err" id="liErr">${esc(msg || '')}</div>
    <button class="btn" data-a="auth.in">SIGN IN</button>`);
}
ACT['auth.in'] = async (ds, el) => {
  const email = $('#liEmail').value.trim(), pass = $('#liPass').value;
  if (!email || !pass) { $('#liErr').textContent = 'Enter your email and password.'; return; }
  el.disabled = true;
  try {
    await SB.signIn(email, pass, $('#liKeep').checked);
    await boot();
  } catch (err) {
    $('#liErr').textContent = err.code === 'network' ? 'No connection.' : 'Wrong email or password.';
    el.disabled = false;
  }
};
ACT['auth.out'] = async () => {
  if (!(await confirmBox('Sign out?', 'You will need your email and password to sign back in.', 'SIGN OUT', true))) return;
  SB.signOut();
  renderLogin();
};

/* ======================================================================
   COACH: the three groups and the four indicators
   ====================================================================== */
async function loadDash() {
  const [profiles, mesos, checkins, tasks, logs] = await Promise.all([
    SB.sel('profiles', { order: 'created_at.asc' }),
    SB.sel('mesocycles', { select: 'id,trainee_id,num,title,weeks,days,status,start_week' }),
    SB.sel('checkins', { select: 'trainee_id,day', filters: [['day', 'gte.' + weekStart()]] }),
    SB.sel('tasks', { select: 'id,trainee_id,status', eq: { status: 'open' } }),
    SB.sel('sets_log', { select: 'trainee_id,meso_id,week,updated_at', filters: [['updated_at', 'gte.' + new Date(Date.now() - 45 * 86400000).toISOString()]] })
  ]);
  A.dash = { profiles, mesos, checkins, tasks, logs };
  return A.dash;
}

function trainees() { return (A.dash.profiles || []).filter((p) => p.role === 'trainee'); }
function mesosOf(id) { return (A.dash.mesos || []).filter((m) => m.trainee_id === id); }
function publishedOf(id) { return mesosOf(id).filter((m) => m.status === 'published').sort((a, b) => a.start_week - b.start_week); }
function openTasks(id) { return (A.dash.tasks || []).filter((t) => t.trainee_id === id).length; }

function subInfo(p) {
  const end = p.end_date;
  if (!end) return { label: p.status === 'new' ? 'NO SUBSCRIPTION' : 'NO DATE', tone: 'red', left: null, ended: p.status === 'expired' };
  const left = daysBetween(today(), end);
  const ended = left < -GRACE || p.status === 'expired';
  return { label: ended ? 'ENDED' : left < 0 ? 'GRACE ' + (GRACE + left) + 'D' : left + 'D LEFT',
           tone: ended ? 'red' : left <= 3 ? 'amber' : 'green', left, ended };
}

/** check-in indicator: green = logged day by day, amber = a day was missed, red = last week ended incomplete */
function checkInfo(p) {
  const ws = weekStart();
  const days = new Set((A.dash.checkins || []).filter((c) => c.trainee_id === p.id).map((c) => c.day));
  let have = 0, missed = false;
  for (let i = 0; i < 7; i++) {
    const d = addDays(ws, i);
    if (d > today()) break;
    if (days.has(d)) have++; else if (d < today()) missed = true;
  }
  const total = (A.dash.checkins || []).filter((c) => c.trainee_id === p.id && c.day >= ws).length;
  return { label: total + '/7', tone: missed ? 'amber' : 'green' };
}

function weekInfo(p) {
  const pub = publishedOf(p.id);
  if (!pub.length) return { label: 'NO PROGRAM', tone: 'red', meso: null, week: 0 };
  const cur = pub[pub.length - 1];
  const logs = (A.dash.logs || []).filter((l) => l.trainee_id === p.id && l.meso_id === cur.id);
  const week = logs.length ? Math.max(...logs.map((l) => l.week)) : 1;
  return { label: 'W' + Math.min(week, cur.weeks) + '/' + cur.weeks, tone: 'blue', meso: cur, week };
}

function group(p) {
  const s = subInfo(p);
  if (s.ended || p.status === 'expired') return 'EXPIRED';
  if (p.status === 'new' && !publishedOf(p.id).length) return 'NEW';
  return 'ACTIVE';
}

/* ======================================================================

   ====================================================================== */
const SPLITS = [
  { id: 'ap', label: 'Anterior / Posterior', base: ['Anterior', 'Posterior'] },
  { id: 'ul', label: 'Upper / Lower', base: ['Upper', 'Lower'] },
  { id: 'ppl', label: 'Push / Pull / Legs', base: ['Push', 'Pull', 'Legs'] },
  { id: 'fb', label: 'Full Body', base: null }
];
const DAY_BASES = ['Anterior', 'Posterior', 'Upper', 'Lower', 'Push', 'Pull', 'Legs'];
const REP_RANGES = ['6-8', '8-10', '10-12'];
const rand = (n) => { let s = ''; const a = 'abcdefghijklmnopqrstuvwxyz0123456789'; for (let i = 0; i < n; i++) s += a[Math.floor(Math.random() * a.length)]; return s; };
function splitNames(id, n) {
  const sp = SPLITS.find((x) => x.id === id) || SPLITS[0];
  if (!sp.base) return Array.from({ length: n }, (_, i) => 'Day ' + (i + 1));
  const rounds = Math.ceil(n / sp.base.length);
  return Array.from({ length: n }, (_, i) => sp.base[i % sp.base.length] + (rounds > 1 ? ' ' + 'ABCDEFG'[Math.floor(i / sp.base.length)] : ''));
}
function dayOptions(cur) {
  const all = [];
  DAY_BASES.forEach((b) => { all.push(b); 'ABCD'.split('').forEach((l) => all.push(b + ' ' + l)); });
  for (let i = 1; i <= 7; i++) all.push('Day ' + i);
  const o = (v) => `<option ${v === cur ? 'selected' : ''}>${esc(v)}</option>`;
  return (all.includes(cur) ? '' : o(cur)) +
    DAY_BASES.map((b) => `<optgroup label="${b}">${[b].concat('ABCD'.split('').map((l) => b + ' ' + l)).map(o).join('')}</optgroup>`).join('') +
    `<optgroup label="Full Body">${[1,2,3,4,5,6,7].map((i) => o('Day ' + i)).join('')}</optgroup>`;
}

function latestVersions(rows, week) {

  return Object.keys(by).map((k) => by[k]).filter((r) => r.ex_id).sort((a, b) => a.pos - b.pos);
}

    return renderTraineeApp();
  } catch (err) {
    if (err.code === 'auth') { SB.signOut(); return renderLogin('Please sign in again.'); }
    main(`<div class="empty"><p>${esc(err.message)}</p><button class="btn" data-a="boot.retry">TRY AGAIN</button></div>`);
  }
}
ACT['boot.retry'] = () => boot();
boot();
</script>
</body>
</html>
