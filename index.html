<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Hajime — Connection Test</title>
<style>
  :root{
    --bg:#0e0e11; --card:#17171b; --line:#2a2a30; --text:#f2f2f4; --soft:#8b8b95;
    --blue:#3b82f6; --green:#22c55e; --red:#ef4444; --yellow:#eab308;
    padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;font-size:15px;line-height:1.5}
  .wrap{max-width:30rem;margin:0 auto;padding:1.25rem 1rem 3rem;display:flex;flex-direction:column;gap:.9rem}
  h1{font-size:1.15rem;font-weight:800;letter-spacing:.04em;text-transform:uppercase}
  h1 span{color:var(--blue)}
  .card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:.9rem;display:flex;flex-direction:column;gap:.6rem}
  label{font-size:.72rem;font-weight:700;color:var(--soft);text-transform:uppercase;letter-spacing:.05em}
  input{width:100%;background:#222228;border:1px solid var(--line);color:var(--text);padding:.7rem .75rem;border-radius:9px;font-size:.92rem;font-family:inherit}
  input:focus{outline:2px solid var(--blue);outline-offset:-1px}
  .row{display:grid;grid-template-columns:1fr 1fr;gap:.6rem}
  .row3{display:grid;grid-template-columns:2fr 1fr 1fr;gap:.6rem}
  button{border:none;border-radius:10px;padding:.85rem;font-size:.9rem;font-weight:800;text-transform:uppercase;letter-spacing:.04em;cursor:pointer;color:#fff;background:var(--blue)}
  button:active{transform:scale(.98)}
  button:disabled{opacity:.5}
  .b2{background:#2e2e36}
  .b3{background:var(--green);color:#04130a}
  #status{border-radius:12px;padding:.9rem;font-size:.92rem;display:none}
  #status.ok{display:block;background:rgba(34,197,94,.12);border:1px solid var(--green)}
  #status.err{display:block;background:rgba(239,68,68,.12);border:1px solid var(--red)}
  #status.wait{display:block;background:rgba(234,179,8,.1);border:1px solid var(--yellow)}
  #status .t{font-weight:800;margin-bottom:.25rem}
  #status .hint{direction:rtl;text-align:right;margin-top:.5rem;color:#e5e5e8;font-size:.9rem;line-height:1.7}
  .tbl{overflow-x:auto}
  table{width:100%;border-collapse:collapse;font-size:.82rem}
  th,td{padding:.45rem .4rem;border-bottom:1px solid var(--line);text-align:left;white-space:nowrap}
  th{color:var(--soft);font-weight:700;font-size:.7rem;text-transform:uppercase}
  .muted{color:var(--soft);font-size:.8rem}
</style>
</head>
<body>
<div class="wrap">
  <h1><span>Hajime</span> · Connection Test</h1>

  <div class="card">
    <label for="url">Script URL (ends with /exec)</label>
    <input id="url" placeholder="https://script.google.com/macros/s/.../exec" autocomplete="off" autocapitalize="off" spellcheck="false">
    <label for="key">Trainee key</label>
    <input id="key" value="test01" autocomplete="off" autocapitalize="off" spellcheck="false">
  </div>

  <button id="bPing">1 · Ping</button>

  <div class="card">
    <div class="row3">
      <div><label for="ex">Exercise</label><input id="ex" value="Test Press"></div>
      <div><label for="kg">KG</label><input id="kg" value="30-40" inputmode="decimal"></div>
      <div><label for="reps">Reps</label><input id="reps" value="10" inputmode="numeric"></div>
    </div>
    <button id="bSave" class="b3">2 · Save test set</button>
    <p class="muted">KG defaults to "30-40" on purpose — it checks that dual (Prime) weights are stored as text, not turned into a date.</p>
  </div>

  <button id="bRead" class="b2">3 · Read my log</button>

  <div id="status"></div>
  <div class="card tbl" id="logCard" style="display:none"><table id="log"></table></div>
</div>

<script>
  const $ = id => document.getElementById(id);
  const store = { get(k){ try{return localStorage.getItem(k)}catch(_){return null} }, set(k,v){ try{localStorage.setItem(k,v)}catch(_){} } };
  $('url').value = store.get('hj_test_url') || '';
  $('url').addEventListener('change', () => store.set('hj_test_url', $('url').value.trim()));
  let setCounter = 0;

  function show(kind, title, detail, hint) {
    const s = $('status');
    s.className = kind;
    s.innerHTML = '';
    const t = document.createElement('div'); t.className = 't'; t.textContent = title; s.appendChild(t);
    if (detail) { const d = document.createElement('div'); d.className = 'muted'; d.textContent = detail; s.appendChild(d); }
    if (hint) { const h = document.createElement('div'); h.className = 'hint'; h.textContent = hint; s.appendChild(h); }
  }

  function getUrl() {
    const u = $('url').value.trim();
    store.set('hj_test_url', u);
    if (!u) { show('err', '✗ No URL', null, 'الصق رابط السكربت أول. تلقاه بعد Deploy → Web app.'); return null; }
    if (/\/dev(\?|$)/.test(u)) { show('err', '✗ Wrong URL', u, 'هذا رابط /dev — يشتغل لك أنت بس. استخدم الرابط اللي ينتهي بـ /exec.'); return null; }
    if (!/^https:\/\/script\.google\.com\/macros\/s\/.+\/exec/.test(u)) { show('err', '✗ URL looks wrong', u, 'الرابط لازم يبدأ بـ https://script.google.com/macros/s/ وينتهي بـ /exec'); return null; }
    return u;
  }

  function diagnose(err, text) {
    if (text && text.trim().startsWith('<')) {
      return 'قوقل رجّع صفحة بدل البيانات. غالبًا صلاحية الوصول مو "Anyone". روح Deploy → Manage deployments → عدّل → Who has access = Anyone، وبعدين New version.';
    }
    if (err && /Failed to fetch|NetworkError|Load failed/i.test(String(err))) {
      return 'الطلب ما وصل أصلًا. تأكد إن الرابط صحيح، وإن النشر نوعه Web app، والوصول Anyone. ولو عدّلت الكود بعد النشر، لازم تسوي New version.';
    }
    return null;
  }

  async function call(method, params, body) {
    const url = getUrl(); if (!url) return null;
    const q = new URLSearchParams(params).toString();
    const t0 = performance.now();
    let text = '';
    try {
      const res = await fetch(url + (q ? '?' + q : ''), method === 'POST'
        ? { method: 'POST', body: JSON.stringify(body) }   // text/plain → no CORS preflight
        : { method: 'GET' });
      text = await res.text();
      const ms = Math.round(performance.now() - t0);
      let data;
      try { data = JSON.parse(text); }
      catch (_) { show('err', '✗ Response is not JSON', text.slice(0, 120), diagnose(null, text)); return null; }
      if (!data.ok) {
        const hint = /setup/i.test(data.error) ? 'شغّل الدالة setup من محرر السكربت مرة وحدة، وبعدين جرب.' : null;
        show('err', '✗ Script error', data.error, hint); return null;
      }
      data._ms = ms;
      return data;
    } catch (err) {
      show('err', '✗ Request failed', String(err), diagnose(err, text));
      return null;
    }
  }

  function busy(btn, on) { btn.disabled = on; }

  $('bPing').onclick = async e => {
    busy(e.target, true); show('wait', '… Pinging');
    const d = await call('GET', { action: 'ping' });
    busy(e.target, false);
    if (d) show('ok', '✓ Connected', `Server answered in ${d._ms} ms`, 'الاتصال شغال. كمّل الخطوة ٢.');
  };

  $('bSave').onclick = async e => {
    const key = $('key').value.trim();
    if (!key) { show('err', '✗ Missing key'); return; }
    busy(e.target, true); show('wait', '… Saving');
    setCounter++;
    const d = await call('POST', null, {
      key, week: 1, day: 'Test Day', exercise: $('ex').value.trim(),
      set: setCounter, kg: $('kg').value.trim(), reps: $('reps').value.trim(), status: 'done'
    });
    busy(e.target, false);
    if (d) show('ok', `✓ Saved (row ${d.row})`, `Took ${d._ms} ms`, 'افتح الشيت وتأكد إن الصف انضاف، وإن خانة KG مكتوب فيها 30-40 مو تاريخ.');
  };

  $('bRead').onclick = async e => {
    const key = $('key').value.trim();
    if (!key) { show('err', '✗ Missing key'); return; }
    busy(e.target, true); show('wait', '… Reading');
    const d = await call('GET', { action: 'read', key });
    busy(e.target, false);
    if (!d) return;
    show('ok', `✓ Read ${d.rows.length} row(s)`, `Took ${d._ms} ms`, d.rows.length ? 'القراءة شغالة. الاختبار نجح كامل.' : 'ما فيه صفوف بهذا المفتاح. سوّ الخطوة ٢ أول.');
    const tbl = $('log'); tbl.innerHTML = '';
    if (!d.rows.length) { $('logCard').style.display = 'none'; return; }
    const head = document.createElement('tr');
    ['Exercise', 'Set', 'KG', 'Reps', 'Time'].forEach(h => { const th = document.createElement('th'); th.textContent = h; head.appendChild(th); });
    tbl.appendChild(head);
    d.rows.slice().reverse().forEach(r => {
      const tr = document.createElement('tr');
      [r.exercise, r.set, r.kg, r.reps, (r.time || '').slice(11, 19)].forEach(v => { const td = document.createElement('td'); td.textContent = v; tr.appendChild(td); });
      tbl.appendChild(tr);
    });
    $('logCard').style.display = 'block';
  };
</script>
</body>
</html>
