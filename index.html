/* ---------------- helpers ---------------- */

const LS = {

class AppError extends Error { constructor(code, msg) { super(msg); this.code = code; } }
let toastTimer = null;
function toast(msg) {

function openModal(html) { $('#sheet').innerHTML = html; $('#modal').hidden = false; }

const Modal = { resolve: null };

function confirmBox(title, text, ok, danger) {

    openModal(`<h3>${esc(title)}</h3><p class="muted">${esc(text)}</p>

/* ---------------- dates: weeks run Sunday → Saturday ---------------- */
function today() { const d = new Date(); return ymd(d); }
function ymd(d) { return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0'); }
function parseYmd(s) { const p = String(s).split('-').map(Number); return new Date(p[0], p[1] - 1, p[2]); }
function weekStart(s) { const d = parseYmd(s || today()); d.setDate(d.getDate() - d.getDay()); return ymd(d); }
function addDays(s, n) { const d = parseYmd(s); d.setDate(d.getDate() + n); return ymd(d); }
function addMonths(s, n) {
  const p = String(s).split('-').map(Number);
  const i = p[1] - 1 + n, y = p[0] + Math.floor(i / 12), m = ((i % 12) + 12) % 12;
  const dim = new Date(y, m + 1, 0).getDate();
  return y + '-' + String(m + 1).padStart(2, '0') + '-' + String(Math.min(p[2], dim)).padStart(2, '0');
}
function daysBetween(a, b) { return Math.round((parseYmd(b) - parseYmd(a)) / 86400000); }
const GRACE = 2;

/* ======================================================================
   SUPABASE (auth + tables)
   ====================================================================== */
const SB = {
  session: LS.get('hj_sess', null),
  save(s, remember) {
    SB.session = s;
    LS.del('hj_sess');
    if (s) LS.set('hj_sess', s, !remember);
  },
  async call(path, opts = {}) {
    const headers = Object.assign({ apikey: CONFIG.SUPABASE_KEY, 'Content-Type': 'application/json' }, opts.headers || {});
    if (opts.auth !== false && SB.session) headers.Authorization = 'Bearer ' + SB.session.access_token;
    let res;
    try {
      res = await fetch(CONFIG.SUPABASE_URL + path, { method: opts.method || 'GET', headers, body: opts.body ? JSON.stringify(opts.body) : undefined });
    } catch (_) { throw new AppError('network', 'No connection.'); }
    const text = await res.text();
    const data = text ? (() => { try { return JSON.parse(text); } catch (_) { return text; } })() : null;
    if (!res.ok) {
      const msg = (data && (data.message || data.error_description || data.error)) || ('Error ' + res.status);
      throw new AppError(res.status === 401 ? 'auth' : 'server', msg);
    }
    return data;
  },
  async signUp(email, password) {
    const s = await SB.call('/auth/v1/signup', { method: 'POST', auth: false, body: { email, password } });
    const sess = s.access_token ? s : (s.session || null);
    if (!sess || !sess.access_token) throw new AppError('server', 'Account created — please sign in.');
    SB.save({ access_token: sess.access_token, refresh_token: sess.refresh_token, expires_at: Date.now() + (sess.expires_in || 3600) * 1000, user: sess.user || s.user }, true);
    return SB.session;
  },
  async signIn(email, password, remember) {
    const s = await SB.call('/auth/v1/token?grant_type=password', { method: 'POST', auth: false, body: { email, password } });
    SB.save({ access_token: s.access_token, refresh_token: s.refresh_token, expires_at: Date.now() + (s.expires_in || 3600) * 1000, user: s.user }, remember);
    return s;
  },
  async refresh() {
    if (!SB.session || !SB.session.refresh_token) throw new AppError('auth', 'Signed out');
    const s = await SB.call('/auth/v1/token?grant_type=refresh_token', { method: 'POST', auth: false, body: { refresh_token: SB.session.refresh_token } });
    SB.save({ access_token: s.access_token, refresh_token: s.refresh_token || SB.session.refresh_token, expires_at: Date.now() + (s.expires_in || 3600) * 1000, user: s.user }, !sessionStorage.getItem('hj_sess'));
  },
  async ready() {
    if (!SB.session) throw new AppError('auth', 'Signed out');
    if (SB.session.expires_at && SB.session.expires_at - Date.now() < 60000) await SB.refresh();
  },
  signOut() { SB.save(null); },

  async sel(table, q = {}) {
    await SB.ready();
    const p = new URLSearchParams();
    p.set('select', q.select || '*');
    Object.keys(q.eq || {}).forEach((k) => p.set(k, 'eq.' + q.eq[k]));
    (q.filters || []).forEach(([k, v]) => p.append(k, v));
    if (q.order) p.set('order', q.order);
    if (q.limit) p.set('limit', q.limit);
    return SB.call('/rest/v1/' + table + '?' + p.toString());
  },
  async ins(table, rows, onConflict) {
    await SB.ready();
    const p = onConflict ? '?on_conflict=' + onConflict : '';
    return SB.call('/rest/v1/' + table + p, {
      method: 'POST',
      headers: { Prefer: 'return=representation' + (onConflict ? ',resolution=merge-duplicates' : '') },
      body: rows
    });
  },
  async del(table, eq) {
    await SB.ready();
    const p = new URLSearchParams();
    Object.keys(eq).forEach((k) => p.set(k, 'eq.' + eq[k]));
    return SB.call('/rest/v1/' + table + '?' + p.toString(), { method: 'DELETE' });
  },
  async upload(path, file) {
    await SB.ready();
    const res = await fetch(CONFIG.SUPABASE_URL + '/storage/v1/object/photos/' + path + '?upsert=true', {
      method: 'POST',
      headers: { apikey: CONFIG.SUPABASE_KEY, Authorization: 'Bearer ' + SB.session.access_token, 'Content-Type': file.type || 'image/jpeg', 'x-upsert': 'true' },
      body: file
    });
    if (!res.ok) throw new AppError('server', 'Upload failed (' + res.status + ')');
    return path;
  },
  async signed(path) {
    await SB.ready();
    const r = await SB.call('/storage/v1/object/sign/photos/' + path, { method: 'POST', body: { expiresIn: 3600 } });
    const u = r.signedURL || r.signedUrl || '';
    return u.startsWith('http') ? u : CONFIG.SUPABASE_URL + '/storage/v1' + (u.startsWith('/') ? '' : '/') + u;
  },
  async upd(table, eq, patch) {
    await SB.ready();
    const p = new URLSearchParams();
    Object.keys(eq).forEach((k) => p.set(k, 'eq.' + eq[k]));
    return SB.call('/rest/v1/' + table + '?' + p.toString(), { method: 'PATCH', headers: { Prefer: 'return=representation' }, body: patch });
  }
};

async function loadDash() {
  const [profiles, mesos, checkins, tasks, logs] = await Promise.all([
    SB.sel('profiles', { order: 'created_at.asc' }),
    SB.sel('mesocycles', { select: 'id,trainee_id,num,title,weeks,days,status,start_week' }),
    SB.sel('checkins', { select: 'trainee_id,day', filters: [['day', 'gte.' + weekStart()]] }),
    SB.sel('tasks', { select: 'id,trainee_id,status', eq: { status: 'open' } }),
    SB.sel('sets_log', { select: 'trainee_id,meso_id,week,updated_at', filters: [['updated_at', 'gte.' + new Date(Date.now() - 45 * 86400000).toISOString()]] })
  ]);
  A.dash = { profiles, mesos, checkins, tasks, logs };
  return A.dash;
}

function trainees() { return (A.dash.profiles || []).filter((p) => p.role === 'trainee'); }
function mesosOf(id) { return (A.dash.mesos || []).filter((m) => m.trainee_id === id); }
function publishedOf(id) { return mesosOf(id).filter((m) => m.status === 'published').sort((a, b) => a.start_week - b.start_week); }
function openTasks(id) { return (A.dash.tasks || []).filter((t) => t.trainee_id === id).length; }

function subInfo(p) {
  const end = p.end_date;
  if (!end) return { label: p.status === 'new' ? 'NO SUBSCRIPTION' : 'NO DATE', tone: 'red', left: null, ended: p.status === 'expired' };
  const left = daysBetween(today(), end);
  const ended = left < -GRACE || p.status === 'expired';
  return { label: ended ? 'ENDED' : left < 0 ? 'GRACE ' + (GRACE + left) + 'D' : left + 'D LEFT',
           tone: ended ? 'red' : left <= 3 ? 'amber' : 'green', left, ended };
}

/** check-in indicator: green = logged day by day, amber = a day was missed, red = last week ended incomplete */
function checkInfo(p) {
  const ws = weekStart();
  const days = new Set((A.dash.checkins || []).filter((c) => c.trainee_id === p.id).map((c) => c.day));
  let have = 0, missed = false;
  for (let i = 0; i < 7; i++) {
    const d = addDays(ws, i);
    if (d > today()) break;
    if (days.has(d)) have++; else if (d < today()) missed = true;
  }
  const total = (A.dash.checkins || []).filter((c) => c.trainee_id === p.id && c.day >= ws).length;
  return { label: total + '/7', tone: missed ? 'amber' : 'green' };
}

function weekInfo(p) {
  const pub = publishedOf(p.id);
  if (!pub.length) return { label: 'NO PROGRAM', tone: 'red', meso: null, week: 0 };
  const cur = pub[pub.length - 1];
  const logs = (A.dash.logs || []).filter((l) => l.trainee_id === p.id && l.meso_id === cur.id);
  const week = logs.length ? Math.max(...logs.map((l) => l.week)) : 1;
  return { label: 'W' + Math.min(week, cur.weeks) + '/' + cur.weeks, tone: 'blue', meso: cur, week };
}

function group(p) {
  const s = subInfo(p);
  if (s.ended || p.status === 'expired') return 'EXPIRED';
  if (p.status === 'new' && !publishedOf(p.id).length) return 'NEW';
  return 'ACTIVE';
}

const GROUPS = ['ACTIVE', 'NEW', 'EXPIRED'];
function seenMap() { return LS.get('hj_seen', {}) || {}; }
function markSeen(g, ids) { const m = seenMap(); m[g] = ids; LS.set('hj_seen', m); }
function renderHome() {
  A.screen = 'home';

/* ======================================================================
   MESOCYCLE: build, publish, edit
   ====================================================================== */
const SPLITS = [
  { id: 'ap', label: 'Anterior / Posterior', base: ['Anterior', 'Posterior'] },
  { id: 'ul', label: 'Upper / Lower', base: ['Upper', 'Lower'] },
  { id: 'ppl', label: 'Push / Pull / Legs', base: ['Push', 'Pull', 'Legs'] },
  { id: 'fb', label: 'Full Body', base: null }
];
const DAY_BASES = ['Anterior', 'Posterior', 'Upper', 'Lower', 'Push', 'Pull', 'Legs'];
const REP_RANGES = ['6-8', '8-10', '10-12'];
const rand = (n) => { let s = ''; const a = 'abcdefghijklmnopqrstuvwxyz0123456789'; for (let i = 0; i < n; i++) s += a[Math.floor(Math.random() * a.length)]; return s; };
function splitNames(id, n) {
  const sp = SPLITS.find((x) => x.id === id) || SPLITS[0];
  if (!sp.base) return Array.from({ length: n }, (_, i) => 'Day ' + (i + 1));
  const rounds = Math.ceil(n / sp.base.length);
  return Array.from({ length: n }, (_, i) => sp.base[i % sp.base.length] + (rounds > 1 ? ' ' + 'ABCDEFG'[Math.floor(i / sp.base.length)] : ''));
}
function dayOptions(cur) {
  const all = [];
  DAY_BASES.forEach((b) => { all.push(b); 'ABCD'.split('').forEach((l) => all.push(b + ' ' + l)); });
  for (let i = 1; i <= 7; i++) all.push('Day ' + i);
  const o = (v) => `<option ${v === cur ? 'selected' : ''}>${esc(v)}</option>`;
  return (all.includes(cur) ? '' : o(cur)) +
    DAY_BASES.map((b) => `<optgroup label="${b}">${[b].concat('ABCD'.split('').map((l) => b + ' ' + l)).map(o).join('')}</optgroup>`).join('') +
    `<optgroup label="Full Body">${[1,2,3,4,5,6,7].map((i) => o('Day ' + i)).join('')}</optgroup>`;
}
function nextDayName(name) {
  let m = /^(.*) ([A-C])$/.exec(name);
  if (m) return m[1] + ' ' + String.fromCharCode(m[2].charCodeAt(0) + 1);
  m = /^Day ([1-6])$/.exec(name);
  return m ? 'Day ' + (+m[1] + 1) : name;
}

    const final = latestVersions(rows, src.weeks);
    const slots = final.map((r, i) => ({ meso_id: created.id, slot: 'S' + rand(8), day_id: dayMap[r.day_id], pos: r.pos, from_week: 1,
                                         ex_id: r.ex_id, sets: r.sets, reps: r.reps, note: r.note }));
    if (slots.length) await SB.ins('plan', slots);

function latestVersions(rows, week) {
  const by = {};
  rows.forEach((r) => { if (r.from_week <= week && (!by[r.slot] || r.from_week >= by[r.slot].from_week)) by[r.slot] = r; });
  return Object.keys(by).map((k) => by[k]).filter((r) => r.ex_id).sort((a, b) => a.pos - b.pos);
}

function openEditor(mesoId, planRows) {
  const m = A.trData.mesos.find((x) => String(x.id) === String(mesoId));
  const ed = { id: m.id, status: m.status, num: m.num, title: m.title || '', weeks: m.weeks, startWeek: m.start_week,
               days: (m.days || []).map((d) => ({ id: d.id, name: d.name })), origDays: (m.days || []).map((d) => d.id),
               slots: [], folded: {}, dirty: false, saving: false, err: '' };
  if (m.status === 'draft') {
    ed.slots = planRows.filter((r) => r.ex_id).map((r) => ({ slot: r.slot, day: r.day_id, pos: r.pos, ex: r.ex_id, sets: r.sets, reps: r.reps, note: r.note || '' }));
  } else {
    ed.eff = {};
    ed.days.forEach((d) => {
      const fw = 1;                     // set properly when logs are loaded
      ed.eff[d.id] = fw;
      latestVersions(planRows.filter((r) => r.day_id === d.id), Math.min(fw, m.weeks))
        .forEach((r) => ed.slots.push({ slot: r.slot, day: d.id, pos: r.pos, ex: r.ex_id, sets: r.sets, reps: r.reps, note: r.note || '' }));
    });
  }
  normPos(ed);
  A.ed = ed;
  A.planRows = planRows;
  A.screen = 'editor';
  renderEditor();
}
function normPos(ed) {
  ed.days.forEach((d) => ed.slots.filter((s) => s.day === d.id).sort((a, b) => a.pos - b.pos).forEach((s, i) => { s.pos = i + 1; }));
}
function edValidate(ed) {
  if (!ed.days.length) return 'Add at least one day.';
  for (const s of ed.slots) if (!/^\d{1,2}(-\d{1,2})?$/.test(s.reps)) return `Fix the reps "${s.reps}" (example: 8-10).`;
  return '';
}
function saveText() {
  const ed = A.ed;
  const v = edValidate(ed);
  if (v) return `<span class="savebar bad">${esc(v)}</span>`;
  if (ed.err) return `<span class="savebar bad">Not saved: ${esc(ed.err)}</span>`;
  if (ed.saving || ed.dirty) return 'Saving…';
  return 'All changes saved ✓';
}
function renderEditor(keep) {
  const ed = A.ed;

ACT['perf.open'] = async () => {
  main('<div class="spin"></div>');

    A.screen = 'perf';
    renderPerf();

function perfItems(m, w, dayId) {
  const rows = A.perf.plan.filter((p) => String(p.meso_id) === String(m.id) && p.day_id === dayId);
  const by = {};
  rows.forEach((r) => { if (r.from_week <= w && (!by[r.slot] || r.from_week >= by[r.slot].from_week)) by[r.slot] = r; });
  return Object.keys(by).map((k) => by[k]).filter((r) => r.ex_id).sort((a, b) => a.pos - b.pos);
}
function perfSet(m, w, slot, n) { return A.perf.sets.find((x) => String(x.meso_id) === String(m.id) && x.week === w && x.slot === slot && x.n === n) || null; }
function perfVolume(m, w, dayId) {
  let v = 0, done = 0, total = 0;
  perfItems(m, w, dayId).forEach((it) => {
    for (let n = 1; n <= it.sets; n++) {
      total++;
      const x = perfSet(m, w, it.slot, n);
      if (x && x.kg && x.reps) { v += parseFloat(x.kg) * parseInt(x.reps, 10); done++; }
    }
  });
  return { v: Math.round(v), done, total };
}
function renderPerf() {
  const P = A.perf, m = P.meso;
  hdr({ title: 'PERFORMANCE', back: true });
  const weeks = [];
  for (let w = 1; w <= m.weeks; w++) weeks.push(w);
  const totals = weeks.map((w) => m.days.reduce((a, d) => a + perfVolume(m, w, d.id).v, 0));
  const rows = weeks.map((w, i) => {
    const prev = totals[i - 1];
    const pct = prev ? Math.round(((totals[i] - prev) / prev) * 1000) / 10 : null;
    const cells = m.days.map((d) => { const x = perfVolume(m, w, d.id); return `<td>${x.v ? x.v : '—'}<div class="sub">${x.done}/${x.total}</div></td>`; }).join('');
    return `<tr><td class="me">W${m.start_week + w - 1}</td>${cells}
      <td><b>${totals[i] || '—'}</b></td>
      <td class="${pct === null ? '' : pct > 0 ? 'c-green' : pct < 0 ? 'c-red' : ''}">${pct === null ? '—' : (pct > 0 ? '+' : '') + pct + '%'}</td></tr>`;
  }).join('');
  const dayBtns = m.days.map((d) => `<button class="pill ${P.day === d.id ? 'blue' : ''}" data-a="perf.day" data-d="${d.id}">${esc(d.name)}</button>`).join('');
  let detail = '';
  if (P.day) {
    const items = perfItems(m, m.weeks, P.day);
    detail = `<div style="overflow-x:auto;margin-top:10px"><table class="tbl"><tr><th>EXERCISE</th>${weeks.map((w) => `<th>W${m.start_week + w - 1}</th>`).join('')}</tr>
      ${items.map((it) => {
        const ex = exById(it.ex_id) || { name: '—' };
        const cells = weeks.map((w) => {
          let best = '';
          for (let n = 1; n <= it.sets; n++) { const x = perfSet(m, w, it.slot, n); if (x && x.kg && x.reps) best = x.kg + '×' + x.reps; }
          return `<td>${esc(best || '—')}</td>`;
        }).join('');
        return `<tr><td class="me">${esc(ex.name)}</td>${cells}</tr>`;
      }).join('')}</table></div>`;
  }
  main(`<p class="muted">Total volume (weight × reps) per session, and how the week moved.</p>
    <div style="overflow-x:auto"><table class="tbl"><tr><th>WEEK</th>${m.days.map((d) => `<th>${esc(d.name)}</th>`).join('')}<th>TOTAL</th><th>VS PREV</th></tr>${rows}</table></div>
    <div class="lbl">EXERCISE BY EXERCISE</div><div class="row" style="flex-wrap:wrap;gap:6px">${dayBtns}</div>${detail}`);
}

      ${INTAKE_PHOTOS.map((p) => `<div class="posebox"><div class="orow"><b>${esc(p.t)}</b>
        ${J.files[p.k] ? '<span class="chip green">تم الاختيار</span>' : '<span class="chip amber">مطلوبة</span>'}</div>
        <label class="btn ghost" style="margin:8px 0 0">${J.files[p.k] ? 'تغيير الصورة' : 'اختر الصورة'}
          <input type="file" accept="image/*" style="display:none" data-ch="join.photo" data-k="${p.k}"></label></div>`).join('')}`;
  } else if (id === 'free') {
    body = `<div class="otitle">مساحة كتابة</div><div class="lbl">فيه شي تبي أعرفه عنك أو عن هدفك؟</div>
      <textarea class="ta" data-in="join.f" data-k="notes">${esc(v.notes || '')}</textarea>`;
  } else {
    body = `<div class="otitle">الشروط</div>
      ${PKG_TERMS.map((t) => `<div class="sumline" style="padding:6px 0"><span>• ${esc(t)}</span></div>`).join('')}
      <label class="row" style="margin:14px 2px"><input type="checkbox" ${v.terms ? 'checked' : ''} style="width:18px;height:18px" data-ch="join.terms">
        <span>قرأت الشروط بالصفحة وموافق عليها</span></label>`;
  }
  const last = id === 'terms';
  main(`<div dir="rtl" style="text-align:right">
    <div class="obar" style="margin-bottom:14px"><div style="width:${Math.round((J.step + 1) / JOIN_STEPS.length * 100)}%"></div></div>
    ${body}
    <div class="err">${esc(J.err || '')}</div>
    <button class="btn" data-a="${last ? 'join.go' : 'join.next'}">${last ? 'إنشاء الحساب' : 'التالي'}</button>
    ${J.step ? '<button class="btn ghost" data-a="join.back">رجوع</button>' : '<button class="btn ghost" data-a="pkg.open">الباقة والشروط</button>'}
    ${J.step ? '' : '<button class="btn ghost" data-a="join.login">عندي حساب</button>'}</div>`);
}
INP['join.f'] = (el) => { A.join.v[el.dataset.k] = el.value; };
CHG['join.terms'] = (el) => { A.join.v.terms = el.checked; };
CHG['join.photo'] = (el) => {
  const f = el.files && el.files[0];
  if (!f) return;
  if (f.size > 8 * 1024 * 1024) return toast('الصورة كبيرة، جرّب وحدة أصغر');
  A.join.files[el.dataset.k] = f;
  renderJoin();
};
ACT['join.pick'] = (ds) => { A.join.v[ds.k] = ds.v; A.join.err = ''; renderJoin(); };
ACT['join.sport'] = (ds) => {
  const sp = A.join.v.sports || (A.join.v.sports = {});
  sp[ds.s] = sp[ds.s] === ds.v ? '' : ds.v;
  renderJoin();
};
ACT['join.login'] = () => { history.replaceState({}, '', location.pathname); A.join = null; renderLogin(); };
ACT['join.go'] = async (ds, el) => {
  const J = A.join, v = J.v;
  const err = joinValid('terms', v);
  if (err) { J.err = err; return renderJoin(); }
  el.disabled = true;
  const email = String(v.email || '').trim().toLowerCase();
  const code = newCode();
  try {
    const sess = await SB.signUp(email, code);
    const photos = {};
    for (const p of INTAKE_PHOTOS) {
      const path = sess.user.id + '/intake-' + p.k + '.jpg';
      await SB.upload(path, J.files[p.k]);
      photos[p.k] = path;
    }
    const intake = {
      'العمر': v.age, 'الطول': v.height, 'الوزن': v.weight,
      [INTAKE.work_type.t]: v.work_type, [INTAKE.work_days.t]: v.work_days, [INTAKE.work_hours.t]: v.work_hours,
      [INTAKE.steps.t]: v.steps, [INTAKE.sports_yes.t]: v.sports_yes,
      'الرياضات': v.sports_yes === 'نعم' ? (v.sports || {}) : {},
      [INTAKE.injury_yes.t]: v.injury_yes, 'تفاصيل الإصابة': v.injury_details || '',
      'ملاحظاته': v.notes || ''
    };
    await SB.upd('profiles', { id: sess.user.id }, { name: String(v.name).trim(), email, intake, photos, access_code: code, status: 'new' });
    A.join = null;
    hdr({ title: 'HAJIME' });
    main(`<div dir="rtl" style="text-align:right"><div class="logo">HAJIME</div>
      <div class="ocard center"><div class="otitle">تم إنشاء حسابك</div>
        <p class="muted">احفظ بياناتك، وبتحتاجها لتسجيل الدخول</p>
        <div class="sumline" style="width:100%"><span class="muted">البريد</span><span dir="ltr">${esc(email)}</span></div>
        <div class="sumline" style="width:100%"><span class="muted">الرمز</span><span style="font-size:20px;font-weight:900" dir="ltr">${esc(code)}</span></div></div>
      <button class="btn" data-a="join.done">ادخل للتطبيق</button></div>`);
  } catch (err2) {
    J.err = /already|registered/i.test(err2.message || '') ? 'هذا البريد مسجّل من قبل' : err2.message;
    renderJoin();
  }
};
ACT['join.done'] = () => { history.replaceState({}, '', location.pathname); boot(); };

/* ======================================================================
   BOOT
   ====================================================================== */
async function boot() {
  if (/(\?|&)join\b/.test(location.search)) { A.join = A.join || { step: 0, v: {}, files: {}, err: '' }; return renderJoin(); }
  if (!SB.session) return renderLogin();
  main('<div class="spin"></div>');
  try {
    const rows = await SB.sel('profiles', { eq: { id: SB.session.user.id } });
    A.me = rows[0];
    if (!A.me) throw new AppError('server', 'Account not found');
    if (A.me.role === 'coach') { await loadDash(); return renderHome(); }
    return startMe();
  } catch (err) {
    if (err.code === 'auth') { SB.signOut(); return renderLogin('Please sign in again.'); }
    main(`<div class="empty"><p>${esc(err.message)}</p><button class="btn" data-a="boot.retry">TRY AGAIN</button></div>`);
  }
}
ACT['boot.retry'] = () => boot();
boot();
</script>
</body>
</html>
