<div class="toast" id="toast"></div>

<script>
'use strict';
/* ======================================================================
   CONNECTION
   ====================================================================== */
const CONFIG = {
  SUPABASE_URL: 'https://bldcowifxcknywoocwgb.supabase.co',
  SUPABASE_KEY: 'sb_publishable_CpfquGZbJ6XRCp4KKXZnXg_zwl3yJ42'
};

/* ---------------- helpers ---------------- */
const $ = (s) => document.querySelector(s);
const esc = (s) => String(s == null ? '' : s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const LS = {
  get(k, d) { try { const v = localStorage.getItem(k) ?? sessionStorage.getItem(k); return v == null ? d : JSON.parse(v); } catch (_) { return d; } },
  set(k, v, session) { try { (session ? sessionStorage : localStorage).setItem(k, JSON.stringify(v)); } catch (_) {} },
  del(k) { try { localStorage.removeItem(k); sessionStorage.removeItem(k); } catch (_) {} }
};
class AppError extends Error { constructor(code, msg) { super(msg); this.code = code; } }
let toastTimer = null;
function toast(msg) {
  const t = $('#toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.classList.remove('show'), 2600);
}
function main(html) { $('#main').innerHTML = html; window.scrollTo(0, 0); }
function hdr(o) {
  $('#hTitle').textContent = o.title || 'HAJIME';
  $('#hBack').hidden = !o.back;
  $('#hRight').innerHTML = o.right || '';
}
function openModal(html) { $('#sheet').innerHTML = html; $('#modal').hidden = false; }
function closeModal() { $('#modal').hidden = true; $('#sheet').innerHTML = ''; }
const Modal = { resolve: null };
function modalDone(v) { const r = Modal.resolve; Modal.resolve = null; closeModal(); if (r) r(v); }
function confirmBox(title, text, ok, danger) {
  return new Promise((res) => {
    Modal.resolve = res;
    openModal(`<h3>${esc(title)}</h3><p class="muted">${esc(text)}</p>
      <button class="btn ${danger ? 'danger' : ''}" data-a="modal.yes">${esc(ok || 'OK')}</button>
      <button class="btn ghost" data-a="modal.no">CANCEL</button>`);
  });
}

/* ---------------- dates: weeks run Sunday → Saturday ---------------- */
function today() { const d = new Date(); return ymd(d); }
function ymd(d) { return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0'); }
function parseYmd(s) { const p = String(s).split('-').map(Number); return new Date(p[0], p[1] - 1, p[2]); }
function weekStart(s) { const d = parseYmd(s || today()); d.setDate(d.getDate() - d.getDay()); return ymd(d); }
function addDays(s, n) { const d = parseYmd(s); d.setDate(d.getDate() + n); return ymd(d); }
function addMonths(s, n) {
  const p = String(s).split('-').map(Number);
  const i = p[1] - 1 + n, y = p[0] + Math.floor(i / 12), m = ((i % 12) + 12) % 12;
  const dim = new Date(y, m + 1, 0).getDate();
  return y + '-' + String(m + 1).padStart(2, '0') + '-' + String(Math.min(p[2], dim)).padStart(2, '0');
}
function daysBetween(a, b) { return Math.round((parseYmd(b) - parseYmd(a)) / 86400000); }
const GRACE = 2;

/* ======================================================================
   SUPABASE (auth + tables)
   ====================================================================== */
const SB = {
  session: LS.get('hj_sess', null),
  save(s, remember) {
    SB.session = s;
    LS.del('hj_sess');
    if (s) LS.set('hj_sess', s, !remember);
  },
  async call(path, opts = {}) {
    const headers = Object.assign({ apikey: CONFIG.SUPABASE_KEY, 'Content-Type': 'application/json' }, opts.headers || {});
    if (opts.auth !== false && SB.session) headers.Authorization = 'Bearer ' + SB.session.access_token;
    let res;
    try {
      res = await fetch(CONFIG.SUPABASE_URL + path, { method: opts.method || 'GET', headers, body: opts.body ? JSON.stringify(opts.body) : undefined });
    } catch (_) { throw new AppError('network', 'No connection.'); }
    const text = await res.text();
    const data = text ? (() => { try { return JSON.parse(text); } catch (_) { return text; } })() : null;
    if (!res.ok) {
      const msg = (data && (data.message || data.error_description || data.error)) || ('Error ' + res.status);
      throw new AppError(res.status === 401 ? 'auth' : 'server', msg);
    }
    return data;
  },
  async signIn(email, password, remember) {
    const s = await SB.call('/auth/v1/token?grant_type=password', { method: 'POST', auth: false, body: { email, password } });
    SB.save({ access_token: s.access_token, refresh_token: s.refresh_token, expires_at: Date.now() + (s.expires_in || 3600) * 1000, user: s.user }, remember);
    return s;
  },
  async refresh() {
    if (!SB.session || !SB.session.refresh_token) throw new AppError('auth', 'Signed out');
    const s = await SB.call('/auth/v1/token?grant_type=refresh_token', { method: 'POST', auth: false, body: { refresh_token: SB.session.refresh_token } });
    SB.save({ access_token: s.access_token, refresh_token: s.refresh_token || SB.session.refresh_token, expires_at: Date.now() + (s.expires_in || 3600) * 1000, user: s.user }, !sessionStorage.getItem('hj_sess'));
  },
  async ready() {
    if (!SB.session) throw new AppError('auth', 'Signed out');
    if (SB.session.expires_at && SB.session.expires_at - Date.now() < 60000) await SB.refresh();
  },
  signOut() { SB.save(null); },

  async sel(table, q = {}) {
    await SB.ready();
    const p = new URLSearchParams();
    p.set('select', q.select || '*');
    Object.keys(q.eq || {}).forEach((k) => p.set(k, 'eq.' + q.eq[k]));
    (q.filters || []).forEach(([k, v]) => p.append(k, v));
    if (q.order) p.set('order', q.order);
    if (q.limit) p.set('limit', q.limit);
    return SB.call('/rest/v1/' + table + '?' + p.toString());
  },
  async ins(table, rows, onConflict) {
    await SB.ready();
    const p = onConflict ? '?on_conflict=' + onConflict : '';
    return SB.call('/rest/v1/' + table + p, {
      method: 'POST',
      headers: { Prefer: 'return=representation' + (onConflict ? ',resolution=merge-duplicates' : '') },
      body: rows
    });
  },
  async del(table, eq) {
    await SB.ready();
    const p = new URLSearchParams();
    Object.keys(eq).forEach((k) => p.set(k, 'eq.' + eq[k]));
    return SB.call('/rest/v1/' + table + '?' + p.toString(), { method: 'DELETE' });
  },
  async upd(table, eq, patch) {
    await SB.ready();
    const p = new URLSearchParams();
    Object.keys(eq).forEach((k) => p.set(k, 'eq.' + eq[k]));
    return SB.call('/rest/v1/' + table + '?' + p.toString(), { method: 'PATCH', headers: { Prefer: 'return=representation' }, body: patch });
  }
};

/* ======================================================================
   APP STATE
   ====================================================================== */
const A = { me: null, screen: '', dash: null, tr: null, trData: null, showClosed: false };

const ACT = {};
const INP = {};
const CHG = {};
document.addEventListener('click', (ev) => {
  const el = ev.target.closest('[data-a]');
  if (!el || el.disabled || el.id === 'modal') return;
  const fn = ACT[el.dataset.a];

   COACH: the three groups and the four indicators
   ====================================================================== */
async function loadDash() {
  const [profiles, mesos, checkins, tasks, logs] = await Promise.all([
    SB.sel('profiles', { order: 'created_at.asc' }),
    SB.sel('mesocycles', { select: 'id,trainee_id,num,title,weeks,days,status,start_week' }),
    SB.sel('checkins', { select: 'trainee_id,day', filters: [['day', 'gte.' + weekStart()]] }),
    SB.sel('tasks', { select: 'id,trainee_id,status', eq: { status: 'open' } }),
    SB.sel('sets_log', { select: 'trainee_id,meso_id,week,updated_at', filters: [['updated_at', 'gte.' + new Date(Date.now() - 45 * 86400000).toISOString()]] })
  ]);
  A.dash = { profiles, mesos, checkins, tasks, logs };
  return A.dash;
}

function trainees() { return (A.dash.profiles || []).filter((p) => p.role === 'trainee'); }
function mesosOf(id) { return (A.dash.mesos || []).filter((m) => m.trainee_id === id); }
function publishedOf(id) { return mesosOf(id).filter((m) => m.status === 'published').sort((a, b) => a.start_week - b.start_week); }
function openTasks(id) { return (A.dash.tasks || []).filter((t) => t.trainee_id === id).length; }

function subInfo(p) {
  const end = p.end_date;
  if (!end) return { label: p.status === 'new' ? 'NO SUBSCRIPTION' : 'NO DATE', tone: 'red', left: null, ended: p.status === 'expired' };
  const left = daysBetween(today(), end);
  const ended = left < -GRACE || p.status === 'expired';
  return { label: ended ? 'ENDED' : left < 0 ? 'GRACE ' + (GRACE + left) + 'D' : left + 'D LEFT',
           tone: ended ? 'red' : left <= 3 ? 'amber' : 'green', left, ended };
}

/** check-in indicator: green = logged day by day, amber = a day was missed, red = last week ended incomplete */
function checkInfo(p) {
  const ws = weekStart();
  const days = new Set((A.dash.checkins || []).filter((c) => c.trainee_id === p.id).map((c) => c.day));
  let have = 0, missed = false;
  for (let i = 0; i < 7; i++) {
    const d = addDays(ws, i);
    if (d > today()) break;
    if (days.has(d)) have++; else if (d < today()) missed = true;
  }
  const total = (A.dash.checkins || []).filter((c) => c.trainee_id === p.id && c.day >= ws).length;
  return { label: total + '/7', tone: missed ? 'amber' : 'green' };
}

function weekInfo(p) {
  const pub = publishedOf(p.id);
  if (!pub.length) return { label: 'NO PROGRAM', tone: 'red', meso: null, week: 0 };
  const cur = pub[pub.length - 1];
  const logs = (A.dash.logs || []).filter((l) => l.trainee_id === p.id && l.meso_id === cur.id);
  const week = logs.length ? Math.max(...logs.map((l) => l.week)) : 1;
  return { label: 'W' + Math.min(week, cur.weeks) + '/' + cur.weeks, tone: 'blue', meso: cur, week };
}

function group(p) {
  const s = subInfo(p);
  if (s.ended || p.status === 'expired') return 'EXPIRED';
  if (p.status === 'new' && !publishedOf(p.id).length) return 'NEW';
  return 'ACTIVE';
}

const GROUPS = ['ACTIVE', 'NEW', 'EXPIRED'];
function seenMap() { return LS.get('hj_seen', {}) || {}; }
function markSeen(g, ids) { const m = seenMap(); m[g] = ids; LS.set('hj_seen', m); }
function renderHome() {
  A.screen = 'home';
  hdr({ title: 'HAJIME · COACH', right: `<button class="hbtn" data-a="home.reload" aria-label="Refresh">↻</button><button class="hbtn txt" data-a="auth.out">EXIT</button>` });
  const list = trainees();
  const groups = { ACTIVE: [], NEW: [], EXPIRED: [] };
  list.forEach((p) => groups[group(p)].push(p));
  if (!A.tab) A.tab = 'ACTIVE';
  const seen = seenMap();
  const isNewIn = (g) => groups[g].some((p) => !(seen[g] || []).includes(p.id));
  markSeen(A.tab, groups[A.tab].map((p) => p.id));
  const card = (p) => {
    const c = checkInfo(p), s = subInfo(p), w = weekInfo(p), n = openTasks(p.id);
    return `<div class="card" data-a="tr.open" data-id="${esc(p.id)}">
      <div class="grow"><div class="ttl">${esc(p.name || p.email)}</div>
        <div class="ind">
          <span class="chip ${c.tone}">CHECK-IN ${c.label}</span>
          <span class="chip ${s.tone}">${esc(s.label)}</span>
          <span class="chip ${w.tone}">${esc(w.label)}</span>
          ${p.status === 'paused' ? '<span class="chip amber">PAUSED</span>' : ''}
        </div></div>
      ${n ? `<span class="badge">${n}</span>` : ''}</div>`;
  };
  const tabs = GROUPS.map((g) => `<button class="tab ${A.tab === g ? 'on' : ''}" data-a="home.tab" data-g="${g}">${g}
      <span class="cnt">${groups[g].length}</span>${g !== A.tab && isNewIn(g) ? '<span class="dot"></span>' : ''}</button>`).join('');
  main(`<div class="tabs">${tabs}</div>
    <div class="list">${groups[A.tab].map(card).join('') || '<div class="card muted">None here.</div>'}</div>
    <button class="btn ghost" data-a="lib.open">EXERCISE LIBRARY</button>`);
}

const SPLITS = [
  { id: 'ap', label: 'Anterior / Posterior', base: ['Anterior', 'Posterior'] },
  { id: 'ul', label: 'Upper / Lower', base: ['Upper', 'Lower'] },
  { id: 'ppl', label: 'Push / Pull / Legs', base: ['Push', 'Pull', 'Legs'] },
  { id: 'fb', label: 'Full Body', base: null }
];
const DAY_BASES = ['Anterior', 'Posterior', 'Upper', 'Lower', 'Push', 'Pull', 'Legs'];
const REP_RANGES = ['6-8', '8-10', '10-12'];
const rand = (n) => { let s = ''; const a = 'abcdefghijklmnopqrstuvwxyz0123456789'; for (let i = 0; i < n; i++) s += a[Math.floor(Math.random() * a.length)]; return s; };
function splitNames(id, n) {
  const sp = SPLITS.find((x) => x.id === id) || SPLITS[0];
  if (!sp.base) return Array.from({ length: n }, (_, i) => 'Day ' + (i + 1));
  const rounds = Math.ceil(n / sp.base.length);
  return Array.from({ length: n }, (_, i) => sp.base[i % sp.base.length] + (rounds > 1 ? ' ' + 'ABCDEFG'[Math.floor(i / sp.base.length)] : ''));
}
function dayOptions(cur) {
  const all = [];
  DAY_BASES.forEach((b) => { all.push(b); 'ABCD'.split('').forEach((l) => all.push(b + ' ' + l)); });
  for (let i = 1; i <= 7; i++) all.push('Day ' + i);
  const o = (v) => `<option ${v === cur ? 'selected' : ''}>${esc(v)}</option>`;
  return (all.includes(cur) ? '' : o(cur)) +
    DAY_BASES.map((b) => `<optgroup label="${b}">${[b].concat('ABCD'.split('').map((l) => b + ' ' + l)).map(o).join('')}</optgroup>`).join('') +
    `<optgroup label="Full Body">${[1,2,3,4,5,6,7].map((i) => o('Day ' + i)).join('')}</optgroup>`;
}
function nextDayName(name) {
  let m = /^(.*) ([A-C])$/.exec(name);
  if (m) return m[1] + ' ' + String.fromCharCode(m[2].charCodeAt(0) + 1);
  m = /^Day ([1-6])$/.exec(name);
  return m ? 'Day ' + (+m[1] + 1) : name;
}

const T = { D: null, ui: { screen: 'home', wi: 0, day: '', slot: '', n: 1, step: 'kg', k1: '', err: '', note: null, pos: {} }, queue: [], flushing: false, offline: false };
const ek = (m, w, s) => m + '|' + w + '|' + s;
const sk2 = (m, w, s, n) => m + '|' + w + '|' + s + '|' + n;
const isSkip = (st) => st === 'skip' || st === 'skipex' || st === 'skipday';
const WHATSAPP = '966534218629';

async function loadMe() {
  const mesos = (await SB.sel('mesocycles', { eq: { trainee_id: A.me.id }, order: 'start_week.asc' })).filter((m) => m.status === 'published');
  const last = mesos.slice(-3);
  const ids = last.map((m) => m.id);
  const inFilter = ids.length ? [['meso_id', 'in.(' + ids.join(',') + ')']] : [['meso_id', 'eq.0']];
  const [plan, entries, sets, checkins] = await Promise.all([
    SB.sel('plan', { filters: inFilter }),
    SB.sel('entries', { filters: inFilter }),
    SB.sel('sets_log', { filters: inFilter }),
    SB.sel('checkins', { filters: [['day', 'gte.' + addDays(weekStart(), -7)]], order: 'day.desc' })
  ]);
  await loadEx();
  const D = { mesos: last, plan, entries: {}, sets: {}, checkins, weeks: [] };
  entries.forEach((e) => { D.entries[ek(e.meso_id, e.week, e.slot)] = e; });
  sets.forEach((x) => { D.sets[sk2(x.meso_id, x.week, x.slot, x.n)] = x; });
  last.forEach((m) => { for (let w = 1; w <= m.weeks; w++) D.weeks.push({ meso: m, w, g: m.start_week + w - 1, start: mesoWeekStart(m, w) }); });
  T.D = D;
  T.queue.forEach((op) => applyOp(op));
  return D;
}
function mesoWeekStart(m, w) { return addDays(weekStart(String(m.published_at || today()).slice(0, 10)), (w - 1) * 7); }
function currentWeekIndex() {
  const ws = weekStart();
  let idx = -1;
  T.D.weeks.forEach((x, i) => { if (x.start <= ws) idx = i; });
  return idx < 0 ? 0 : idx;
}
function curWeek() { return T.D.weeks[T.ui.wi]; }
function planOf(mesoId) { return T.D.plan.filter((p) => String(p.meso_id) === String(mesoId)); }
function entryOf(m, w, slot) { return T.D.entries[ek(m, w, slot)] || null; }
function setOf(m, w, slot, n) { return T.D.sets[sk2(m, w, slot, n)] || null; }
function dayItems(m, w, dayId) {
  const rows = planOf(m.id).filter((p) => p.day_id === dayId);
  const by = {};
  rows.forEach((r) => { if (r.from_week <= w && (!by[r.slot] || r.from_week >= by[r.slot].from_week)) by[r.slot] = r; });
  return Object.keys(by).map((k) => by[k]).filter((r) => r.ex_id)
    .map((r) => ({ slot: r.slot, day: dayId, ex: r.ex_id, sets: r.sets, reps: r.reps, note: r.note || '', pos: r.pos, from: r.from_week }))
    .sort((a, b) => a.pos - b.pos);
}
function setState(x) {
  if (!x) return 'empty';
  if (isSkip(x.status)) return 'skip';
  if (x.kg && x.reps) return 'done';
  if (x.kg || x.reps) return 'partial';
  return 'empty';
}
function exStatus(m, w, it) {
  const e = entryOf(m.id, w, it.slot);
  if (e && (e.status === 'skip' || e.status === 'skipday')) return 'skip';
  let done = 0, touched = 0;
  for (let i = 1; i <= it.sets; i++) { const st = setState(setOf(m.id, w, it.slot, i)); if (st === 'done') done++; if (st !== 'empty') touched++; }
  if (done === it.sets) return 'done';
  return touched ? 'partial' : 'none';
}
function exFinished(m, w, it) {
  const st = exStatus(m, w, it);
  if (st === 'done' || st === 'skip') return true;
  for (let i = 1; i <= it.sets; i++) { const s = setState(setOf(m.id, w, it.slot, i)); if (s !== 'done' && s !== 'skip') return false; }
  return true;
}
function doneSets(m, w, it) { let c = 0; for (let i = 1; i <= it.sets; i++) if (setState(setOf(m.id, w, it.slot, i)) === 'done') c++; return c; }
function dayStatus(m, w, dayId) {
  const items = dayItems(m, w, dayId);
  if (!items.length) return 'none';
  const sts = items.map((it) => exStatus(m, w, it));
  if (sts.every((x) => x === 'done')) return 'done';
  if (sts.every((x) => x === 'skip')) return 'skip';
  return sts.some((x) => x !== 'none') ? 'partial' : 'none';
}

/* ---------- writes: queued so a weak signal never loses a set ---------- */
function qKey() { return 'hj_q_' + A.me.id; }
function applyOp(op) {
  if (op.table === 'sets_log') T.D.sets[sk2(op.row.meso_id, op.row.week, op.row.slot, op.row.n)] = Object.assign({}, T.D.sets[sk2(op.row.meso_id, op.row.week, op.row.slot, op.row.n)], op.row);
  else if (op.table === 'entries') T.D.entries[ek(op.row.meso_id, op.row.week, op.row.slot)] = Object.assign({}, T.D.entries[ek(op.row.meso_id, op.row.week, op.row.slot)], op.row);
  else if (op.table === 'checkins') {
    const i = T.D.checkins.findIndex((c) => c.day === op.row.day);
    if (i >= 0) T.D.checkins[i] = Object.assign({}, T.D.checkins[i], op.row); else T.D.checkins.unshift(op.row);
  }
}
function push(table, row, conflict) {
  const op = { table, row: Object.assign({ trainee_id: A.me.id }, row), conflict };
  if (table === 'sets_log' || table === 'entries') {
    T.queue = T.queue.filter((q) => !(q.table === table && q.row.meso_id === op.row.meso_id && q.row.week === op.row.week && q.row.slot === op.row.slot && q.row.n === op.row.n));
  } else if (table === 'checkins') {
    T.queue = T.queue.filter((q) => !(q.table === 'checkins' && q.row.day === op.row.day));

}
async function flush() {
  if (T.flushing || !T.queue.length) { updateSync(); return; }
  T.flushing = true;
  updateSync();
  const op = T.queue[0];
  try {
    await SB.ins(op.table, [op.row], op.conflict);
    T.queue.shift();
    LS.set(qKey(), T.queue);
    T.offline = false;
    T.flushing = false;
    updateSync();
    if (T.queue.length) flush();
  } catch (err) {
    T.flushing = false;
    if (err.code === 'network') { T.offline = true; setTimeout(flush, 5000); }
    else { T.queue.shift(); LS.set(qKey(), T.queue); toast('One entry was rejected'); }
    updateSync();

}

      if (x && setState(x) !== 'empty' && (!x.ex_id || String(x.ex_id) === String(it.ex))) sets.push({ n, kg: x.kg, reps: x.reps, st: setState(x) });
    }
    if (sets.length) { const e = entryOf(wk.meso.id, wk.w, it.slot) || {}; return { g: wk.g, sets, tnote: e.tnote || '' }; }
  }
  return null;
}
function coachNoteFor(it) {
  const wk = curWeek();
  for (let w = wk.w; w >= 1; w--) { const e = entryOf(wk.meso.id, w, it.slot); if (e && e.cnote) return e.cnote; }
  return it.note || '';
}
function defaultKg(it, prev) {
  const wk = curWeek();
  const own = setOf(wk.meso.id, wk.w, it.slot, T.ui.n);
  if (own && own.kg && !isSkip(own.status)) return own.kg;
  for (let k = T.ui.n - 1; k >= 1; k--) { const x = setOf(wk.meso.id, wk.w, it.slot, k); if (x && x.kg && !isSkip(x.status)) return x.kg; }
  if (prev) { const same = prev.sets.find((x) => x.n === T.ui.n && x.kg) || prev.sets.find((x) => x.kg); if (same) return same.kg; }
  return '';
}
function renderEx() {
  T.ui.screen = 'ex';
  const wk = curWeek(), it = curItem();
  if (!it) { T.ui.screen = 'day'; return renderDay(); }
  const d = wk.meso.days.find((x) => x.id === T.ui.day);
  hdr({ title: d ? d.name : '', back: true, right: syncPill() });
  T.ui.pos[wk.meso.id + '|' + wk.w + '|' + it.slot] = { n: T.ui.n, step: T.ui.step };
  const ex = exById(it.ex) || { name: '—' };
  const cur = setOf(wk.meso.id, wk.w, it.slot, T.ui.n) || {};
  const prev = prevPerf(it);
  const cnote = coachNoteFor(it);
  const tbox = (l, v) => `<div class="tbox"><div class="tlabel">${l}</div><div class="tval">${v}</div></div>`;
  let panel = '';
  if (T.ui.step === 'note') {
    panel = `<div class="ocard"><div class="otitle step">WORKOUT NOTE (OPTIONAL)</div>
      <textarea class="ta" data-in="me.note" maxlength="1000" placeholder="How did it feel?">${esc(T.ui.note || '')}</textarea>
      <button class="btn" style="background:var(--green);color:#06210f" data-a="me.finish">FINISH EXERCISE ✓</button></div>`;
  } else if (T.ui.step === 'reps') {
    const [lo, hi] = String(it.reps).split('-').map(Number);
    let grid = '';
    for (let r = 1; r <= 16; r++) grid += `<button class="${String(cur.reps) === String(r) ? 'on' : (r >= lo && r <= (hi || lo) ? 'tg' : '')}" data-a="me.reps" data-r="${r}">${r}</button>`;
    panel = `<div class="ocard"><div class="otitle step">SELECT COMPLETED REPS</div><div class="stepsub">${esc(cur.kg || '—')} KG</div>
      <div class="reps">${grid}</div><div class="err">${esc(T.ui.err)}</div></div>`;
  } else {
    const def = defaultKg(it, prev);
    const keys = ['1','2','3','4','5','6','7','8','9','.','0','del'];
    panel = `<div class="ocard"><div class="otitle step">WEIGHT (KG)</div>
      <div class="kgd ${T.ui.k1 ? 'typed' : 'ph'}"><span class="num">${esc(T.ui.k1 || def || '0')}</span><span class="unit">KG</span></div>
      <div class="pad">${keys.map((k) => `<button class="${k === '.' || k === 'del' ? 'act' : ''}" data-a="me.key" data-k="${k}">${k === 'del' ? '⌫' : k}</button>`).join('')}</div>
      <div class="err">${esc(T.ui.err)}</div><button class="btn" data-a="me.nextKg">NEXT</button></div>`;
  }
  const prevHtml = T.ui.step === 'note' ? '' : prev
    ? `<div class="osum"><div class="olabel">LAST LOG (WEEK ${prev.g})</div>
        ${prev.sets.map((x) => `<div class="osumrow"><span style="color:var(--blue)">S${x.n}</span><span class="grow">${x.st === 'skip' ? 'SKIPPED' : esc(x.kg || '—') + ' KG × ' + esc(x.reps || '—')}</span></div>`).join('')}
        ${prev.tnote ? `<div class="onote"><b>NOTE:</b> ${esc(prev.tnote)}</div>` : ''}</div>`
    : `<div class="osum"><div class="olabel">LAST LOG</div><div class="oempty">NO PREVIOUS LOG FOUND</div></div>`;
  main(`<div class="excard"><div class="otitle">${esc(ex.name)}</div>
      ${ex.video ? `<a class="pill" href="${esc(ex.video)}" target="_blank" rel="noopener">▶ VIDEO</a>` : ''}
      ${cnote ? `<div class="cnote"><b>COACH</b>${esc(cnote)}</div>` : ''}</div>
    <div class="trow">${tbox('SET', T.ui.step === 'note' ? 'DONE' : T.ui.n + ' OF ' + it.sets)}${tbox('TARGET REPS', esc(it.reps))}</div>
    ${T.ui.step !== 'note' ? `<div class="row" style="margin-bottom:10px"><button class="pill grow" data-a="me.clearSet">CLEAR SET</button><button class="pill red grow" data-a="me.skipSet">SKIP SET</button></div>` : ''}
    ${isSkip(cur.status) && T.ui.step !== 'note' ? `<div class="skipbox">Set ${T.ui.n} skipped${cur.reason ? ': ' + esc(cur.reason) : ''}</div>` : ''}
    ${panel}${prevHtml}`);
}
function setRow(patch) {
  const wk = curWeek(), it = curItem();
  const cur = setOf(wk.meso.id, wk.w, it.slot, T.ui.n) || {};
  return Object.assign({ meso_id: wk.meso.id, week: wk.w, slot: it.slot, n: T.ui.n, ex_id: it.ex,
    kg: cur.kg || '', reps: cur.reps || '', status: cur.status || '', reason: cur.reason || '', updated_at: new Date().toISOString() }, patch);
}
ACT['me.key'] = (ds) => {
  let v = T.ui.k1;
  if (ds.k === 'del') v = v.slice(0, -1);
  else if (ds.k === '.') { if (!v.includes('.')) v = (v || '0') + '.'; }
  else { const nv = (v === '0' ? '' : v) + ds.k; if (/^\d{1,4}(\.\d{0,2})?$/.test(nv)) v = nv; }
  T.ui.k1 = v;
  T.ui.err = '';
  renderEx();
};
ACT['me.nextKg'] = () => {
  const it = curItem();
  const prev = prevPerf(it);
  let val = (T.ui.k1 || defaultKg(it, prev) || '').trim();
  if (val.endsWith('.')) val = val.slice(0, -1);
  if (!/^\d{1,4}(\.\d{1,2})?$/.test(val)) { T.ui.err = 'Enter the weight.'; return renderEx(); }
  const cur = setOf(curWeek().meso.id, curWeek().w, it.slot, T.ui.n) || {};
  push('sets_log', setRow({ kg: val, reps: isSkip(cur.status) ? '' : (cur.reps || ''), status: 'done', reason: '' }), 'trainee_id,meso_id,week,slot,n');
  T.ui.step = 'reps';
  T.ui.k1 = '';
  T.ui.err = '';
  renderEx();
};
ACT['me.reps'] = (ds) => {
  const it = curItem();
  const cur = setOf(curWeek().meso.id, curWeek().w, it.slot, T.ui.n) || {};
  if (!cur.kg || isSkip(cur.status)) { T.ui.step = 'kg'; T.ui.err = 'Enter the weight first.'; return renderEx(); }
  push('sets_log', setRow({ reps: String(ds.r), status: 'done', reason: '' }), 'trainee_id,meso_id,week,slot,n');
  advance(it);
};
function advance(it) {
  const next = openSetFor(it, T.ui.n);
  if (next) { T.ui.n = next; T.ui.step = 'kg'; } else T.ui.step = 'note';
  T.ui.k1 = '';
  T.ui.err = '';
  renderEx();
}
ACT['me.clearSet'] = () => {
  push('sets_log', setRow({ kg: '', reps: '', status: '', reason: '' }), 'trainee_id,meso_id,week,slot,n');
  T.ui.step = 'kg';
  T.ui.k1 = '';
  renderEx();
};
ACT['me.skipSet'] = async () => {
  const it = curItem();
  const reason = await askReason('Skip set ' + T.ui.n);
  if (!reason) return;
  push('sets_log', setRow({ kg: '', reps: '', status: 'skip', reason }), 'trainee_id,meso_id,week,slot,n');
  advance(it);
};
INP['me.note'] = (el) => { T.ui.note = el.value; };
function saveNote() {
  const it = curItem();
  if (!it || T.ui.note === null) return;
  const wk = curWeek();
  const e = entryOf(wk.meso.id, wk.w, it.slot);
  const v = String(T.ui.note).trim();
  if (v !== ((e && e.tnote) || '')) push('entries', entryRow(wk, it, { tnote: v }), 'trainee_id,meso_id,week,slot');
}
ACT['me.finish'] = () => { saveNote(); T.ui.screen = 'day'; renderDay(); };

/* ---------- daily check-in ---------- */
const SLEEP = ['4-5', '5-6', '7-8', '9+'];
const STEPS = ['2000-3000', '4000-5000', '6000-8000', '9000-12000', '+13000'];
const ACTIVITY = ['30-60 min', '1-1.5 h', '2-3 h'];
ACT['me.check'] = () => { T.ui.screen = 'check'; T.ui.day0 = today(); renderCheck(); };
function checkOf(day) { return T.D.checkins.find((c) => c.day === day) || {}; }
function renderCheck() {
  T.ui.screen = 'check';
  const day = T.ui.day0 || today();
  const c = checkOf(day);
  hdr({ title: 'DAILY CHECK-IN', back: true, right: syncPill() });
  const band = (name, list, val) => `<div class="lbl">${name}</div><div class="bands">${list.map((v) =>
    `<button class="${val === v ? 'on' : ''}" data-a="me.band" data-f="${name === 'SLEEP' ? 'sleep_band' : name === 'STEPS' ? 'steps_band' : 'activity_band'}" data-v="${esc(v)}">${esc(v)}</button>`).join('')}</div>`;
  const days = [0, 1, 2].map((i) => addDays(today(), -i));
  main(`<div class="row" style="margin-bottom:10px">${days.map((d) => `<button class="pill ${d === day ? 'blue' : ''}" data-a="me.checkDay" data-d="${d}">${d === today() ? 'TODAY' : esc(d.slice(5))}</button>`).join('')}</div>
    ${band('SLEEP', SLEEP, c.sleep_band)}
    ${band('STEPS', STEPS, c.steps_band)}
    <div class="lbl">WEIGHT (KG)</div><input class="in" id="ciWeight" inputmode="decimal" value="${c.weight != null ? esc(c.weight) : ''}">
    <div class="lbl">CALORIES</div><input class="in" id="ciKcal" inputmode="numeric" value="${c.kcal != null ? esc(c.kcal) : ''}">
    <div class="lbl">PROTEIN TARGET</div><div class="bands">
      <button class="${c.protein_ok === true ? 'on' : ''}" data-a="me.protein" data-v="1">YES</button>
      <button class="${c.protein_ok === false ? 'on' : ''}" data-a="me.protein" data-v="0">NO</button></div>
    ${band('ACTIVITY', ACTIVITY, c.activity_band)}
    ${c.activity_band ? `<div class="lbl">ACTIVITY TYPE</div><input class="in" id="ciType" value="${esc(c.activity_type || '')}" placeholder="e.g. padel">` : ''}
    <div class="lbl">ANYTHING UNUSUAL</div><textarea class="ta" id="ciNote" maxlength="500">${esc(c.note || '')}</textarea>
    <button class="btn" data-a="me.checkSave">SAVE</button>`);
}
ACT['me.checkDay'] = (ds) => { T.ui.day0 = ds.d; renderCheck(); };
function saveCheck(patch) {
  const day = T.ui.day0 || today();
  push('checkins', Object.assign({ day, updated_at: new Date().toISOString() }, checkOf(day), patch), 'trainee_id,day');
}
ACT['me.band'] = (ds) => { saveCheck({ [ds.f]: ds.v }); renderCheck(); };
ACT['me.protein'] = (ds) => { saveCheck({ protein_ok: ds.v === '1' }); renderCheck(); };
ACT['me.checkSave'] = () => {
  const num = (v) => (v === '' ? null : Number(v));
  saveCheck({ weight: num($('#ciWeight').value.trim()), kcal: num($('#ciKcal').value.trim()),
              activity_type: $('#ciType') ? $('#ciType').value.trim() : '', note: $('#ciNote').value.trim() });
  toast('Saved');
  T.ui.screen = 'home';
  renderTHome();
};

/* ======================================================================
   BOOT
   ====================================================================== */
async function boot() {
  if (!SB.session) return renderLogin();
  main('<div class="spin"></div>');
  try {
    const rows = await SB.sel('profiles', { eq: { id: SB.session.user.id } });
    A.me = rows[0];
    if (!A.me) throw new AppError('server', 'Account not found');
    if (A.me.role === 'coach') { await loadDash(); return renderHome(); }
    return startMe();
  } catch (err) {
    if (err.code === 'auth') { SB.signOut(); return renderLogin('Please sign in again.'); }
    main(`<div class="empty"><p>${esc(err.message)}</p><button class="btn" data-a="boot.retry">TRY AGAIN</button></div>`);
  }
}
ACT['boot.retry'] = () => boot();
boot();
</script>
